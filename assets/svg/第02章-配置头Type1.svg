<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">Type 01h 桥配置头：桥的核心是"三个 Bus 号 + 三对窗口"</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#5a6b86">桥靠 Bus 号范围决定"往下转不转"，靠 Base/Limit 窗口决定"哪些地址往下游过"——PCIe 的 RC/Switch 端口就是这套语义</text>

  <g font-size="10" fill="#8a97ab" text-anchor="middle">
    <text x="140" y="82">Byte 3</text><text x="330" y="82">Byte 2</text><text x="520" y="82">Byte 1</text><text x="710" y="82">Byte 0</text>
    <text x="806" y="82">偏移</text>
  </g>

  <g font-size="10.5" text-anchor="middle">
    <rect x="60" y="90" width="380" height="28" fill="#dbe8fb" stroke="#93b7f0"/><text x="250" y="109" fill="#1b4f9c">Device ID</text>
    <rect x="440" y="90" width="380" height="28" fill="#dbe8fb" stroke="#93b7f0"/><text x="630" y="109" fill="#1b4f9c">Vendor ID</text><text x="806" y="109" fill="#5a6b86" font-size="10">00h</text>

    <rect x="60" y="120" width="380" height="28" fill="#e6eefb" stroke="#93b7f0"/><text x="250" y="139" fill="#1b4f9c">Status</text>
    <rect x="440" y="120" width="380" height="28" fill="#fdeee0" stroke="#f0c193"/><text x="630" y="139" fill="#a85a17">Command</text><text x="806" y="139" fill="#5a6b86" font-size="10">04h</text>

    <rect x="60" y="150" width="570" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="345" y="169" fill="#33415c">Class Code</text>
    <rect x="630" y="150" width="190" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="725" y="169" fill="#33415c">Revision</text><text x="806" y="169" fill="#5a6b86" font-size="10">08h</text>

    <rect x="60" y="180" width="190" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="155" y="199" fill="#33415c">BIST</text>
    <rect x="250" y="180" width="190" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="345" y="199" fill="#33415c">Hdr=01h</text>
    <rect x="440" y="180" width="190" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="535" y="199" fill="#33415c">Lat.Timer</text>
    <rect x="630" y="180" width="190" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="725" y="199" fill="#33415c">Cache Ln</text><text x="806" y="199" fill="#5a6b86" font-size="10">0Ch</text>

    <rect x="60" y="210" width="760" height="28" fill="#c9ead6" stroke="#4a9a6a"/><text x="440" y="229" fill="#14663f" font-weight="700">BAR0（桥自身寄存器，可选）</text><text x="806" y="229" fill="#5a6b86" font-size="10">10h</text>
    <rect x="60" y="240" width="760" height="28" fill="#c9ead6" stroke="#4a9a6a"/><text x="440" y="259" fill="#14663f" font-weight="700">BAR1</text><text x="806" y="259" fill="#5a6b86" font-size="10">14h</text>
  </g>

  <!-- Bus 号行 -->
  <g font-size="10.3" text-anchor="middle">
    <rect x="60" y="270" width="190" height="34" fill="#efe9f9" stroke="#c4b1e8"/><text x="155" y="285" fill="#7a5cc0" font-weight="700">Secondary</text><text x="155" y="298" fill="#7a5cc0" font-weight="700">Lat.Timer</text>
    <rect x="250" y="270" width="190" height="34" fill="#e2d6f5" stroke="#c4b1e8"/><text x="345" y="285" fill="#7a5cc0" font-weight="700">Subordinate</text><text x="345" y="298" fill="#7a5cc0" font-weight="700">Bus #</text>
    <rect x="440" y="270" width="190" height="34" fill="#e2d6f5" stroke="#c4b1e8"/><text x="535" y="285" fill="#7a5cc0" font-weight="700">Secondary</text><text x="535" y="298" fill="#7a5cc0" font-weight="700">Bus #</text>
    <rect x="630" y="270" width="190" height="34" fill="#e2d6f5" stroke="#c4b1e8"/><text x="725" y="285" fill="#7a5cc0" font-weight="700">Primary</text><text x="725" y="298" fill="#7a5cc0" font-weight="700">Bus #</text>
    <text x="806" y="291" fill="#5a6b86" font-size="10">18h</text>
  </g>

  <!-- IO base/limit + secondary status -->
  <g font-size="10.3" text-anchor="middle">
    <rect x="60" y="306" width="380" height="28" fill="#eef3fa" stroke="#aab8cc"/><text x="250" y="325" fill="#33415c">Secondary Status</text>
    <rect x="440" y="306" width="190" height="28" fill="#fff3e6" stroke="#f0c193"/><text x="535" y="325" fill="#a85a17">I/O Limit</text>
    <rect x="630" y="306" width="190" height="28" fill="#fff3e6" stroke="#f0c193"/><text x="725" y="325" fill="#a85a17">I/O Base</text><text x="806" y="325" fill="#5a6b86" font-size="10">1Ch</text>

    <rect x="60" y="336" width="380" height="28" fill="#ffe9d6" stroke="#f0c193"/><text x="250" y="355" fill="#a85a17" font-weight="700">Memory Limit</text>
    <rect x="440" y="336" width="380" height="28" fill="#ffe9d6" stroke="#f0c193"/><text x="630" y="355" fill="#a85a17" font-weight="700">Memory Base</text><text x="806" y="355" fill="#5a6b86" font-size="10">20h</text>

    <rect x="60" y="366" width="380" height="28" fill="#ffedd9" stroke="#f0c193"/><text x="250" y="385" fill="#a85a17">Prefetchable Mem Limit</text>
    <rect x="440" y="366" width="380" height="28" fill="#ffedd9" stroke="#f0c193"/><text x="630" y="385" fill="#a85a17">Prefetchable Mem Base</text><text x="806" y="385" fill="#5a6b86" font-size="10">24h</text>

    <rect x="60" y="396" width="760" height="26" fill="#f4f7fb" stroke="#aab8cc"/><text x="440" y="414" fill="#8a97ab">Prefetchable Base/Limit Upper 32 bits</text><text x="806" y="414" fill="#5a6b86" font-size="10">28–2Ch</text>
    <rect x="60" y="424" width="760" height="26" fill="#f4f7fb" stroke="#aab8cc"/><text x="440" y="442" fill="#8a97ab">I/O Base/Limit Upper 16 bits</text><text x="806" y="442" fill="#5a6b86" font-size="10">30h</text>
    <rect x="60" y="452" width="570" height="26" fill="#f4f7fb" stroke="#aab8cc"/><text x="345" y="470" fill="#8a97ab">Reserved</text>
    <rect x="630" y="452" width="190" height="26" fill="#efe9f9" stroke="#c4b1e8"/><text x="725" y="470" fill="#7a5cc0">Cap Ptr</text><text x="806" y="470" fill="#5a6b86" font-size="10">34h</text>
    <rect x="60" y="480" width="760" height="26" fill="#f4f7fb" stroke="#aab8cc"/><text x="440" y="498" fill="#8a97ab">Expansion ROM Base Address</text><text x="806" y="498" fill="#5a6b86" font-size="10">38h</text>
    <rect x="60" y="508" width="570" height="26" fill="#fef0f0" stroke="#e0b0b0"/><text x="345" y="526" fill="#c0392b">Bridge Control</text>
    <rect x="630" y="508" width="190" height="26" fill="#fdeee0" stroke="#f0c193"/><text x="725" y="526" fill="#a85a17">Int Line/Pin</text><text x="806" y="526" fill="#5a6b86" font-size="10">3Ch</text>
  </g>

  <!-- 注解 -->
  <rect x="60" y="544" width="760" height="46" rx="8" fill="#ffffff" stroke="#d8dee9"/>
  <text x="75" y="562" font-size="10.5" fill="#33415c"><tspan font-weight="700" fill="#7a5cc0">紫（18h）</tspan>=三个 Bus 号：Primary(上游)、Secondary(直连下游)、Subordinate(下游最大编号)——桥据此判断配置请求要不要往下转。</text>
  <text x="75" y="580" font-size="10.5" fill="#33415c"><tspan font-weight="700" fill="#a85a17">橙</tspan>=三对 Base/Limit 窗口（I/O、Memory、Prefetchable Memory）：落在窗口内的地址才往下游转发——这就是桥的"地址过滤"。</text>
</svg>
