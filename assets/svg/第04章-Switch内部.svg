<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">Switch 的内部：一堆"背靠背"的虚拟 PCI-PCI 桥</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#5a6b86">这正是"PCIe 软件模型完全继承 PCI"的关键——Switch 对软件呈现为多个桥</text>

  <defs>
    <marker id="s4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 上行链路 -->
  <rect x="360" y="82" width="180" height="40" rx="8" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="450" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#2a3b57">↑ 上行（朝 RC 方向）</text>

  <!-- Switch 外框 -->
  <rect x="90" y="150" width="720" height="320" rx="14" fill="#eef3f9" stroke="#93b7f0" stroke-width="2"/>
  <text x="110" y="176" font-size="14" font-weight="700" fill="#1b4f9c">Switch</text>

  <!-- 上行端口桥 -->
  <rect x="340" y="190" width="220" height="56" rx="9" fill="#ffffff" stroke="#93b7f0"/>
  <text x="450" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4f9c">上行端口（Upstream Port）</text>
  <text x="450" y="232" text-anchor="middle" font-size="10.5" fill="#3f5678">= 一个虚拟 PCI-PCI 桥（Type 1 头）</text>
  <line x1="450" y1="122" x2="450" y2="190" stroke="#5a6b86" stroke-width="2" marker-end="url(#s4)"/>

  <!-- 内部虚拟总线 -->
  <rect x="140" y="286" width="620" height="30" rx="6" fill="#dbe8fb" stroke="#93b7f0"/>
  <text x="450" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4f9c">内部虚拟 PCI 总线（把各端口桥连起来）</text>
  <line x1="450" y1="246" x2="450" y2="286" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#s4)"/>

  <!-- 下行端口桥 x3 -->
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="356" width="180" height="70" rx="9" fill="#ffffff" stroke="#8fd3ac"/>
    <text x="240" y="380" font-weight="700" fill="#1c7a4a">下行端口 0</text>
    <text x="240" y="399" fill="#3f5678" font-size="10">虚拟 PCI-PCI 桥</text>
    <text x="240" y="415" fill="#8a97ab" font-size="9.5">含地址窗口 + Bus 区间</text>
    <rect x="360" y="356" width="180" height="70" rx="9" fill="#ffffff" stroke="#8fd3ac"/>
    <text x="450" y="380" font-weight="700" fill="#1c7a4a">下行端口 1</text>
    <text x="450" y="399" fill="#3f5678" font-size="10">虚拟 PCI-PCI 桥</text>
    <text x="450" y="415" fill="#8a97ab" font-size="9.5">按 §6.2 做路由</text>
    <rect x="570" y="356" width="180" height="70" rx="9" fill="#ffffff" stroke="#8fd3ac"/>
    <text x="660" y="380" font-weight="700" fill="#1c7a4a">下行端口 2</text>
    <text x="660" y="399" fill="#3f5678" font-size="10">虚拟 PCI-PCI 桥</text>
    <text x="660" y="415" fill="#8a97ab" font-size="9.5">…可扩展更多</text>
  </g>
  <line x1="300" y1="316" x2="240" y2="356" stroke="#5a6b86" stroke-width="1.4" marker-end="url(#s4)"/>
  <line x1="450" y1="316" x2="450" y2="356" stroke="#5a6b86" stroke-width="1.4" marker-end="url(#s4)"/>
  <line x1="600" y1="316" x2="660" y2="356" stroke="#5a6b86" stroke-width="1.4" marker-end="url(#s4)"/>

  <!-- 下游设备 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="165" y="504" width="150" height="40" rx="7" fill="#e9f7ef" stroke="#8fd3ac"/><text x="240" y="529" font-weight="600" fill="#1c7a4a">下游设备 A</text>
    <rect x="375" y="504" width="150" height="40" rx="7" fill="#e9f7ef" stroke="#8fd3ac"/><text x="450" y="529" font-weight="600" fill="#1c7a4a">下游设备 B</text>
    <rect x="585" y="504" width="150" height="40" rx="7" fill="#e9f7ef" stroke="#8fd3ac"/><text x="660" y="529" font-weight="600" fill="#1c7a4a">下游设备 C</text>
  </g>
  <line x1="240" y1="470" x2="240" y2="504" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#s4)"/>
  <line x1="450" y1="470" x2="450" y2="504" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#s4)"/>
  <line x1="660" y1="470" x2="660" y2="504" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#s4)"/>

  <text x="450" y="576" text-anchor="middle" font-size="11" fill="#8a97ab">💡 一个 N 口 Switch = 1 个上行桥 + N 个下行桥，靠内部虚拟总线相连；枚举时逐个被分配 Bus/Dev 号</text>
</svg>
