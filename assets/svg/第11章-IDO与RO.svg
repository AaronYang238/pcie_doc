<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">放宽序以提性能：Relaxed Ordering 与 ID-Based Ordering</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">默认强序保证正确；在"确认无依赖"时放宽，能显著减少队头阻塞、提升吞吐</text>

  <!-- RO -->
  <rect x="40" y="82" width="430" height="220" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="255" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1b4f9c">Relaxed Ordering (RO)</text>
  <text x="255" y="128" text-anchor="middle" font-size="10.5" fill="#3f5678">TLP 头 Attr 位 · 放宽"写-写保序"</text>
  <g font-size="11" fill="#33415c">
    <text x="60" y="154"><tspan font-weight="700">场景</tspan>：GPU / 加速器把大块结果 DMA 回内存。</text>
    <text x="60" y="176">这些数据块彼此无依赖，谁先落地都行 →</text>
    <text x="60" y="196">开 RO 让它们可以乱序写入，不必排队。</text>
    <rect x="60" y="210" width="380" height="34" rx="6" fill="#f0faf4" stroke="#a9dcc0"/>
    <text x="70" y="232" font-size="10.5" fill="#14663f">✓ 适合：纯数据搬运，块间无因果</text>
    <rect x="60" y="250" width="380" height="34" rx="6" fill="#faf0f0" stroke="#e0b0b0"/>
    <text x="70" y="272" font-size="10.5" fill="#c0392b">✗ 危险：对"标志/门铃"开 RO → 数据竞争 bug</text>
  </g>

  <!-- IDO -->
  <rect x="490" y="82" width="430" height="220" rx="10" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="705" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1c7a4a">ID-Based Ordering (IDO)</text>
  <text x="705" y="128" text-anchor="middle" font-size="10.5" fill="#3f5678">Attr 位 · 按 Requester ID 放宽相互排序</text>
  <g font-size="11" fill="#33415c">
    <text x="510" y="154"><tspan font-weight="700">场景</tspan>：多个设备 / 多个 VF 共享一条上游链路。</text>
    <text x="510" y="176">设备 X 和设备 Y 的事务本就互不相干 →</text>
    <text x="510" y="196">没必要为了保 X 的序而阻塞 Y 的事务。</text>
    <rect x="510" y="210" width="380" height="34" rx="6" fill="#f0faf4" stroke="#a9dcc0"/>
    <text x="520" y="232" font-size="10.5" fill="#14663f">✓ 不同 RID 之间放宽 → 消除跨设备队头阻塞</text>
    <rect x="510" y="250" width="380" height="34" rx="6" fill="#f0f6ff" stroke="#93b7f0"/>
    <text x="520" y="272" font-size="10.5" fill="#1b4f9c">同一 RID 内部仍保持原有序（安全）</text>
  </g>

  <!-- 队头阻塞对比 -->
  <text x="480" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a4a">直观：队头阻塞 vs 放宽后</text>
  <g font-size="10.5" text-anchor="middle">
    <!-- 阻塞 -->
    <text x="230" y="362" fill="#c0392b" font-weight="700">强序：一个慢事务堵住整队</text>
    <rect x="80" y="374" width="60" height="30" rx="4" fill="#ffe0e0" stroke="#e0a0a0"/><text x="110" y="394" fill="#c0392b">X-慢</text>
    <rect x="145" y="374" width="60" height="30" rx="4" fill="#eef1f6" stroke="#c7d0dd"/><text x="175" y="394" fill="#8a97ab">Y</text>
    <rect x="210" y="374" width="60" height="30" rx="4" fill="#eef1f6" stroke="#c7d0dd"/><text x="240" y="394" fill="#8a97ab">Y</text>
    <rect x="275" y="374" width="60" height="30" rx="4" fill="#eef1f6" stroke="#c7d0dd"/><text x="305" y="394" fill="#8a97ab">Y</text>
    <text x="230" y="424" fill="#8a97ab">Y 被前面的 X 白白挡住</text>
    <!-- 放宽 -->
    <text x="720" y="362" fill="#14663f" font-weight="700">IDO：Y 绕过 X，各走各的</text>
    <rect x="570" y="374" width="60" height="30" rx="4" fill="#ffe0e0" stroke="#e0a0a0"/><text x="600" y="394" fill="#c0392b">X-慢</text>
    <rect x="635" y="374" width="60" height="30" rx="4" fill="#c9ecd8" stroke="#8fd3ac"/><text x="665" y="394" fill="#14663f">Y✓</text>
    <rect x="700" y="374" width="60" height="30" rx="4" fill="#c9ecd8" stroke="#8fd3ac"/><text x="730" y="394" fill="#14663f">Y✓</text>
    <rect x="765" y="374" width="60" height="30" rx="4" fill="#c9ecd8" stroke="#8fd3ac"/><text x="795" y="394" fill="#14663f">Y✓</text>
    <text x="720" y="424" fill="#8a97ab">Y 不同 RID，可先行 → 吞吐↑</text>
  </g>

  <!-- 底部准则 -->
  <rect x="40" y="444" width="880" height="112" rx="10" fill="#fff7ec" stroke="#f0c193"/>
  <text x="60" y="470" font-size="13" font-weight="700" fill="#a85a17">使用准则：放宽是"性能开关"，不是默认</text>
  <g font-size="11.3" fill="#33415c">
    <text x="60" y="496">• <tspan font-weight="700">默认强序</tspan> 是正确性底线；<tspan font-weight="700">只在能证明"无因果依赖"时</tspan>才对特定流量开 RO/IDO。</text>
    <text x="60" y="520">• 典型正确用法：大块 DMA 载荷开 RO；多设备共享链路开 IDO。<tspan font-weight="700" fill="#c0392b">切忌对标志/门铃/中断触发写开 RO</tspan>。</text>
    <text x="60" y="544" fill="#5a6b86">📘 现代大流量场景（GPU/DPU/多 VF）广泛用 RO/IDO 提吞吐；MSI（Posted 写）则依赖强序保证"中断到达时数据已就绪"。</text>
  </g>
</svg>
