<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">Bus 号的深度优先枚举（DFS）：一条道走到黑，再回头</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">软件从 Bus 0 出发，遇桥就先钻到底给下游编号，回填 Subordinate，再处理兄弟——保证每个 Bus 号唯一且区间连续</text>

  <defs>
    <marker id="e02" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>

  <!-- 树 -->
  <!-- HOST/RC bus0 -->
  <rect x="400" y="86" width="160" height="46" rx="8" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="480" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#a85a17">HOST 主桥</text>
  <text x="480" y="124" text-anchor="middle" font-size="10" fill="#3f5678">Bus 0</text>

  <!-- 桥A -->
  <rect x="180" y="180" width="150" height="56" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="255" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4f9c">桥 A</text>
  <text x="255" y="220" text-anchor="middle" font-size="9" fill="#3f5678">Sec=1, Sub=3</text>
  <!-- 桥B -->
  <rect x="620" y="180" width="150" height="56" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="695" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4f9c">桥 B</text>
  <text x="695" y="220" text-anchor="middle" font-size="9" fill="#3f5678">Sec=4, Sub=4</text>

  <line x1="440" y1="132" x2="255" y2="180" stroke="#5a6b86" stroke-width="1.6"/>
  <line x1="520" y1="132" x2="695" y2="180" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- Bus1 line under A -->
  <line x1="120" y1="270" x2="390" y2="270" stroke="#7a5cc0" stroke-width="3"/>
  <text x="120" y="262" font-size="10" font-weight="700" fill="#7a5cc0">Bus 1</text>
  <line x1="255" y1="236" x2="255" y2="270" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- 桥C on bus1 -->
  <rect x="150" y="300" width="140" height="52" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="220" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4f9c">桥 C</text>
  <text x="220" y="339" text-anchor="middle" font-size="9" fill="#3f5678">Sec=2, Sub=3</text>
  <line x1="220" y1="270" x2="220" y2="300" stroke="#5a6b86" stroke-width="1.6"/>
  <!-- 设备 on bus1 -->
  <rect x="310" y="300" width="120" height="52" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="370" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1c7a4a">设备</text>
  <line x1="330" y1="270" x2="370" y2="300" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- Bus2 under C -->
  <line x1="120" y1="392" x2="320" y2="392" stroke="#7a5cc0" stroke-width="3"/>
  <text x="120" y="384" font-size="10" font-weight="700" fill="#7a5cc0">Bus 2</text>
  <line x1="220" y1="352" x2="220" y2="392" stroke="#5a6b86" stroke-width="1.6"/>
  <rect x="160" y="420" width="130" height="46" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="225" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#1c7a4a">设备（Bus2）</text>
  <line x1="225" y1="392" x2="225" y2="420" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- Bus3 under C (第二个下游? 简化：桥C Sub=3 表示其下最大是3) 用文字标注 -->
  <text x="360" y="392" font-size="9" fill="#8a97ab">…桥C 下若还有一级 → Bus 3</text>

  <!-- Bus4 under B -->
  <line x1="600" y1="270" x2="800" y2="270" stroke="#7a5cc0" stroke-width="3"/>
  <text x="805" y="266" font-size="10" font-weight="700" fill="#7a5cc0">Bus 4</text>
  <line x1="695" y1="236" x2="695" y2="270" stroke="#5a6b86" stroke-width="1.6"/>
  <rect x="630" y="300" width="130" height="46" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="695" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#1c7a4a">设备（Bus4）</text>
  <line x1="695" y1="270" x2="695" y2="300" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- DFS 顺序箭头 -->
  <path d="M480,132 Q300,150 255,180" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#e02)"/>
  <text x="330" y="160" font-size="9.5" fill="#c0392b" font-weight="700">① 进桥A→Bus1</text>
  <path d="M255,236 Q235,270 220,300" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#e02)"/>
  <text x="150" y="290" font-size="9.5" fill="#c0392b" font-weight="700">② 进桥C→Bus2</text>
  <text x="120" y="500" font-size="9.5" fill="#c0392b" font-weight="700">③ Bus2 到底，回填桥C Sub</text>
  <path d="M300,236 Q400,255 480,150" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="470" y="250" font-size="9.5" fill="#c0392b" font-weight="700">④ 回到 Bus0，再处理桥B→Bus4</text>

  <!-- 底注 -->
  <rect x="40" y="516" width="880" height="52" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="538" font-size="11.5" font-weight="700" fill="#1b2a4a">关键规则：</text>
  <text x="150" y="538" font-size="11" fill="#33415c">桥的 <tspan font-weight="700" fill="#7a5cc0">Secondary</tspan>=直连下游 Bus 号，<tspan font-weight="700" fill="#7a5cc0">Subordinate</tspan>=其下游所有总线的<tspan font-weight="700">最大</tspan>编号——先写 Sec，钻到底后回填 Sub。</text>
  <text x="60" y="556" font-size="10" fill="#8a97ab">📘 PCIe 完整继承这套 DFS 枚举：RC/Switch/Endpoint 仍以 PCI-PCI 桥语义呈现，`lspci -t` 看到的树就是它（第04章）。</text>
</svg>
