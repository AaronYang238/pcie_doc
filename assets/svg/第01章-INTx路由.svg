<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">INTx 中断路由：四根共享线 + 过桥"旋转"（swizzle）</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">INTA#–INTD# 电平触发、低有效、可共享；过 PCI 桥时按规则旋转，均衡四根线的负载</text>

  <defs>
    <marker id="ix01" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 设备侧 -->
  <rect x="40" y="90" width="200" height="200" rx="10" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="140" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1c7a4a">下级总线的设备</text>
  <g font-size="10" text-anchor="middle" fill="#33415c">
    <rect x="60" y="130" width="160" height="32" rx="6" fill="#fff" stroke="#a9dcc0"/><text x="140" y="151">设备1 用 INTA#</text>
    <rect x="60" y="170" width="160" height="32" rx="6" fill="#fff" stroke="#a9dcc0"/><text x="140" y="191">设备2 用 INTA#</text>
    <rect x="60" y="210" width="160" height="32" rx="6" fill="#fff" stroke="#a9dcc0"/><text x="140" y="231">设备3 用 INTB#</text>
    <text x="140" y="266" font-size="9" fill="#8a97ab">多设备可共享同一根线</text>
  </g>

  <!-- PCI 桥 swizzle -->
  <rect x="360" y="120" width="220" height="150" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="470" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b4f9c">PCI 桥：INTx swizzle</text>
  <text x="470" y="168" text-anchor="middle" font-size="9.5" fill="#3f5678">按设备号旋转映射：</text>
  <g font-size="10" fill="#33415c" text-anchor="middle">
    <text x="470" y="190">下级 INTA# → 上级 INT(A+Dev) mod 4</text>
    <text x="470" y="212" fill="#8a97ab" font-size="9">例：A→B→C→D 依设备号轮转</text>
  </g>
  <text x="470" y="240" text-anchor="middle" font-size="9.5" fill="#1b4f9c">目的：让四根线负载均衡</text>
  <text x="470" y="258" text-anchor="middle" font-size="9" fill="#8a97ab">避免全挤在 INTA#</text>

  <line x1="240" y1="190" x2="360" y2="190" stroke="#5a6b86" stroke-width="2" marker-end="url(#ix01)"/>
  <text x="300" y="182" text-anchor="middle" font-size="9" fill="#5a6b86">INTA#–D#</text>

  <!-- 中断控制器 -->
  <rect x="700" y="120" width="220" height="150" rx="10" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="810" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a85a17">中断控制器</text>
  <text x="810" y="168" text-anchor="middle" font-size="10" fill="#3f5678">PIC（8259）/ I-O APIC</text>
  <text x="810" y="192" text-anchor="middle" font-size="10" fill="#3f5678">四根线经主板布线</text>
  <text x="810" y="210" text-anchor="middle" font-size="10" fill="#3f5678">接入中断输入引脚</text>
  <text x="810" y="234" text-anchor="middle" font-size="9.5" fill="#a85a17">→ 转成对 CPU 的中断</text>

  <line x1="580" y1="190" x2="700" y2="190" stroke="#5a6b86" stroke-width="2" marker-end="url(#ix01)"/>
  <text x="640" y="182" text-anchor="middle" font-size="9" fill="#5a6b86">上级 INTx</text>

  <!-- 特性面板 -->
  <rect x="40" y="310" width="880" height="120" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="336" font-size="13" font-weight="700" fill="#1b2a4a">INTx 的三个特征（也是它的三个痛点）</text>
  <g font-size="11.2" fill="#33415c">
    <text x="60" y="362">• <tspan font-weight="700">电平触发、低有效</tspan>：线拉低表示"有中断"，需一直保持到被处理——共享时难区分是谁。</text>
    <text x="60" y="386">• <tspan font-weight="700">可共享</tspan>：多设备共用一根线省引脚，但 CPU 要<tspan font-weight="700">轮询所有共享设备</tspan>才知道谁触发，慢。</text>
    <text x="60" y="410">• <tspan font-weight="700">需边带引脚 + 主板布线</tspan>：与 PCIe"端到端、少引脚"哲学冲突——这正是 MSI 取代它的动因。</text>
  </g>

  <!-- 演进 -->
  <rect x="40" y="448" width="880" height="72" rx="10" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="60" y="474" font-size="12.5" font-weight="700" fill="#eaf1fb">📘 演进</text>
  <text x="130" y="474" font-size="11.5" fill="#c6d2e6">INTx（专用线、共享）→ MSI（带内存储器写）→ MSI-X（每向量独立、可绑核）→ IMS</text>
  <text x="60" y="500" font-size="10.5" fill="#8bc6f0">PCIe 里 INTx 退化为"虚拟 INTx 消息"（Assert/Deassert_INTx），物理线消失；主流设备一律用 MSI-X（第10章）。</text>
</svg>
