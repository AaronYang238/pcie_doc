<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="620" rx="14" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf1fb">链路可靠性：Gen5 的 ACK/NAK（当前主流）vs Gen6+ 的 FEC+Flit（展望）</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#8fa6c8">Gen5 及以前误码率足够低，LCRC + 按 TLP 重放就够；PAM4 误码飙升后才需要 FEC 先纠错</text>

  <!-- 左：Gen5 主流面板 -->
  <rect x="40" y="82" width="530" height="400" rx="10" fill="#1a3050" stroke="#8bc6f0" stroke-width="2"/>
  <text x="305" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#8bc6f0">Gen5 及以前（当前主流）：两道防线</text>
  <text x="305" y="130" text-anchor="middle" font-size="10.5" fill="#ffd479">128b/130b · 无 FEC · 以「单个 TLP」为可靠性单位</text>

  <g font-size="11">
    <rect x="64" y="146" width="482" height="52" rx="8" fill="#15263d" stroke="#4a6a9a"/>
    <text x="80" y="168" fill="#8bc6f0" font-weight="700">① LCRC 校验（每个 TLP 一个）</text>
    <text x="80" y="188" fill="#c6d2e6" font-size="10.5">接收端逐 TLP 校验；通过 → 回 ACK，失败 → 回 NAK</text>

    <rect x="64" y="208" width="482" height="52" rx="8" fill="#241a2e" stroke="#5a3a6a"/>
    <text x="80" y="230" fill="#d9a7f0" font-weight="700">② 重放 Replay（按 TLP 粒度）</text>
    <text x="80" y="250" fill="#c6d2e6" font-size="10.5">发送端重放缓冲按序号重发出错及其后的 TLP（详见 §7.2 ACK/NAK）</text>
  </g>

  <!-- Gen5 线上格式示意 -->
  <text x="64" y="292" font-size="12" font-weight="700" fill="#dce6f5">线上格式：每个 TLP 独立成帧、独立 LCRC</text>
  <g font-size="10" text-anchor="middle">
    <rect x="64" y="304" width="52" height="36" fill="#3a2a1a" stroke="#a86a2a"/><text x="90" y="326" fill="#f0c193">STP</text>
    <rect x="116" y="304" width="60" height="36" fill="#1c3a2a" stroke="#4a8a6a"/><text x="146" y="326" fill="#9fe0bd">Seq#</text>
    <rect x="176" y="304" width="240" height="36" fill="#1a2a44" stroke="#4a6a9a"/><text x="296" y="326" fill="#9fc0f0">TLP（头 + 数据）</text>
    <rect x="416" y="304" width="66" height="36" fill="#1c3a2a" stroke="#4a8a6a"/><text x="449" y="326" fill="#9fe0bd">LCRC</text>
    <rect x="482" y="304" width="52" height="36" fill="#3a2a1a" stroke="#a86a2a"/><text x="508" y="326" fill="#f0c193">END</text>
  </g>

  <g font-size="11" fill="#c6d2e6">
    <text x="64" y="374" font-weight="700" fill="#8bc6f0">为什么这套就够用？</text>
    <text x="64" y="396">· NRZ 2 电平眼图大，32 GT/s 下误码率仍够低（~1e-12 量级）</text>
    <text x="64" y="416">· 错误稀少 → 偶尔整包重放的代价可以接受</text>
    <text x="64" y="436">· 无 FEC 解码延迟，链路时延更低</text>
    <text x="64" y="464" font-size="10" fill="#8fa6c8">这就是你在 Gen3/4/5 设备上实际运行的机制 —— 本章 §7.2 的主线。</text>
  </g>

  <!-- 右：Gen6+ 展望面板 -->
  <rect x="590" y="82" width="330" height="400" rx="10" fill="#101c14" stroke="#3a5a2a"/>
  <text x="755" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#c6e88a">🔭 Gen6+ 展望：三道防线</text>
  <text x="755" y="130" text-anchor="middle" font-size="10" fill="#8fa6c8">PAM4 误码率飙升 → 必须先就地纠错</text>

  <g font-size="10.5">
    <rect x="610" y="146" width="290" height="46" rx="8" fill="#1d2f18" stroke="#3a5a2a"/>
    <text x="626" y="166" fill="#c6e88a" font-weight="700">① FEC 前向纠错（零往返）</text>
    <text x="626" y="184" fill="#c6d2e6" font-size="9.5">接收端就地纠正少量位错，不需重传</text>
    <rect x="610" y="200" width="290" height="46" rx="8" fill="#15263d" stroke="#2c4568"/>
    <text x="626" y="220" fill="#8bc6f0" font-weight="700">② Flit 级 CRC（FEC 纠不了时发现）</text>
    <text x="626" y="238" fill="#c6d2e6" font-size="9.5">判定"这个 Flit 是否仍有错"</text>
    <rect x="610" y="254" width="290" height="46" rx="8" fill="#241a2e" stroke="#5a3a6a"/>
    <text x="626" y="274" fill="#d9a7f0" font-weight="700">③ 重放（按 256B Flit 粒度）</text>
    <text x="626" y="292" fill="#c6d2e6" font-size="9.5">ACK/NAK 语义保留，单位从 TLP 变 Flit</text>
  </g>

  <!-- PAM4 mini 波形 -->
  <g font-size="9" fill="#c6d2e6">
    <text x="610" y="326" font-size="10.5" font-weight="700" fill="#c6e88a">PAM4：4 电平 = 2 bit/符号（Gray 码）</text>
    <line x1="620" y1="416" x2="620" y2="340" stroke="#4a6a9a" stroke-width="1.2"/>
    <line x1="620" y1="416" x2="850" y2="416" stroke="#4a6a9a" stroke-width="1.2"/>
    <line x1="620" y1="348" x2="850" y2="348" stroke="#3a5a2a" stroke-dasharray="3 3"/><text x="858" y="352" fill="#c6e88a">10</text>
    <line x1="620" y1="370" x2="850" y2="370" stroke="#3a5a2a" stroke-dasharray="3 3"/><text x="858" y="374" fill="#c6e88a">11</text>
    <line x1="620" y1="392" x2="850" y2="392" stroke="#3a5a2a" stroke-dasharray="3 3"/><text x="858" y="396" fill="#c6e88a">01</text>
    <line x1="620" y1="414" x2="850" y2="414" stroke="#3a5a2a" stroke-dasharray="3 3"/><text x="858" y="418" fill="#c6e88a">00</text>
    <polyline points="620,392 655,392 655,348 690,348 690,414 725,414 725,370 760,370 760,392 795,392 795,348 830,348" fill="none" stroke="#ff9e6b" stroke-width="2"/>
  </g>
  <g font-size="9.5" fill="#8fa6c8">
    <text x="610" y="440">3 个眼图、间距更小 → 判决易错；</text>
    <text x="610" y="456">Gray 码使错也多为单 bit，利于 FEC 纠正</text>
    <text x="610" y="474" fill="#6f86a8">DLP/CRC/FEC 占 Flit 固定比例（见 第06章展望图）</text>
  </g>

  <!-- 底部收束 -->
  <rect x="40" y="500" width="880" height="102" rx="10" fill="#15263d" stroke="#2c4568"/>
  <text x="60" y="526" font-size="13" font-weight="700" fill="#eaf1fb">一句话对照</text>
  <g font-size="11.3" fill="#c6d2e6">
    <text x="60" y="550">· <tspan font-weight="700" fill="#8bc6f0">Gen5（主线）</tspan>：误码稀少 → LCRC 发现 + 按 TLP 重放兜底，简单低延迟 —— 你今天调试的链路就是它。</text>
    <text x="60" y="572">· <tspan font-weight="700" fill="#c6e88a">Gen6+（展望）</tspan>：PAM4 误码多 → FEC 先吃掉大部分错，Flit 定长化开销；"保证两跳可靠"的职责不变。</text>
    <text x="60" y="592" fill="#6f86a8" font-size="10">📘 对照 Base Spec 7.0：Data Link Layer（ACK/NAK）为主线；Flit Mode / FEC 章节为展望。</text>
  </g>
</svg>
