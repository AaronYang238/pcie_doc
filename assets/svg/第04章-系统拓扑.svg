<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">一台 PCIe 系统的完整拓扑（树状 · 端到端）</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#5a6b86">每条链路都是点对点全双工；数字为链路宽度（xN = N 条 Lane）</text>

  <defs>
    <marker id="t4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- CPU + RC -->
  <rect x="300" y="82" width="360" height="86" rx="10" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="480" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#2a3b57">CPU / SoC</text>
  <rect x="320" y="118" width="150" height="40" rx="7" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="395" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4f9c">Root Complex</text>
  <rect x="486" y="118" width="154" height="40" rx="7" fill="#f2f6fc" stroke="#b7cdf0"/>
  <text x="563" y="135" text-anchor="middle" font-size="10.5" fill="#3f5678">内存控制器 / IOMMU</text>
  <text x="563" y="151" text-anchor="middle" font-size="9.5" fill="#8a97ab">(集成在 RC 内)</text>

  <!-- Root Ports -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="150" y="200" width="120" height="34" rx="6" fill="#eaf2fe" stroke="#93b7f0"/><text x="210" y="222" font-weight="600" fill="#1b4f9c">Root Port 0</text>
    <rect x="420" y="200" width="120" height="34" rx="6" fill="#eaf2fe" stroke="#93b7f0"/><text x="480" y="222" font-weight="600" fill="#1b4f9c">Root Port 1</text>
    <rect x="690" y="200" width="120" height="34" rx="6" fill="#eaf2fe" stroke="#93b7f0"/><text x="750" y="222" font-weight="600" fill="#1b4f9c">Root Port 2</text>
  </g>
  <line x1="395" y1="158" x2="210" y2="200" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#t4)"/>
  <line x1="440" y1="168" x2="480" y2="200" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#t4)"/>
  <line x1="470" y1="168" x2="750" y2="200" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#t4)"/>

  <!-- 左：直连 Endpoint (GPU x16) -->
  <rect x="140" y="300" width="140" height="60" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="210" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1c7a4a">Endpoint</text>
  <text x="210" y="345" text-anchor="middle" font-size="10.5" fill="#3f5678">GPU / 加速器</text>
  <line x1="210" y1="234" x2="210" y2="300" stroke="#5a6b86" stroke-width="2.4" marker-end="url(#t4)"/>
  <text x="228" y="272" font-size="12" font-weight="700" fill="#c0392b">x16</text>

  <!-- 中：Switch -->
  <rect x="405" y="300" width="150" height="60" rx="8" fill="#eef3f9" stroke="#93b7f0"/>
  <text x="480" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4f9c">Switch</text>
  <text x="480" y="345" text-anchor="middle" font-size="10" fill="#8a97ab">(扇出多设备)</text>
  <line x1="480" y1="234" x2="480" y2="300" stroke="#5a6b86" stroke-width="1.8" marker-end="url(#t4)"/>
  <text x="498" y="272" font-size="11" font-weight="700" fill="#1b4f9c">x8</text>

  <!-- Switch 下游三个 Endpoint -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="360" y="440" width="110" height="54" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/><text x="415" y="463" font-weight="700" fill="#1c7a4a">NVMe SSD</text><text x="415" y="480" fill="#3f5678">Endpoint</text>
    <rect x="490" y="440" width="110" height="54" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/><text x="545" y="463" font-weight="700" fill="#1c7a4a">网卡 NIC</text><text x="545" y="480" fill="#3f5678">Endpoint</text>
    <rect x="360" y="524" width="110" height="54" rx="8" fill="#fdf1e7" stroke="#f0c193"/><text x="415" y="547" font-weight="700" fill="#a85a17">PCIe→PCI 桥</text><text x="415" y="564" fill="#3f5678">接旧设备</text>
  </g>
  <line x1="450" y1="360" x2="415" y2="440" stroke="#5a6b86" stroke-width="1.4" marker-end="url(#t4)"/>
  <text x="410" y="404" font-size="10" font-weight="700" fill="#1c7a4a">x4</text>
  <line x1="510" y1="360" x2="545" y2="440" stroke="#5a6b86" stroke-width="1.4" marker-end="url(#t4)"/>
  <text x="548" y="404" font-size="10" font-weight="700" fill="#1c7a4a">x4</text>
  <line x1="440" y1="360" x2="415" y2="524" stroke="#5a6b86" stroke-width="1.2" marker-end="url(#t4)" stroke-dasharray="4 3"/>
  <text x="360" y="470" font-size="10" font-weight="700" fill="#a85a17">x1</text>

  <!-- 右：直连 Endpoint -->
  <rect x="680" y="300" width="140" height="60" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="750" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1c7a4a">Endpoint</text>
  <text x="750" y="345" text-anchor="middle" font-size="10.5" fill="#3f5678">存储 / 网络</text>
  <line x1="750" y1="234" x2="750" y2="300" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#t4)"/>
  <text x="768" y="272" font-size="11" font-weight="700" fill="#1b4f9c">x4</text>

  <!-- 要点 -->
  <rect x="620" y="440" width="300" height="138" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="640" y="464" font-size="12.5" font-weight="700" fill="#1b2a4a">三类节点</text>
  <g font-size="11" fill="#33415c">
    <text x="640" y="488"><tspan font-weight="700" fill="#1b4f9c">Root Complex</tspan>：树根，代 CPU 发起事务</text>
    <text x="640" y="510"><tspan font-weight="700" fill="#1b4f9c">Switch</tspan>：内部一堆虚拟 PCI-PCI 桥</text>
    <text x="640" y="532"><tspan font-weight="700" fill="#1c7a4a">Endpoint</tspan>：叶子上的功能设备</text>
    <text x="640" y="556" fill="#8a97ab" font-size="10">每个 Root Port / Switch 端口</text>
    <text x="640" y="571" fill="#8a97ab" font-size="10">在软件看来都是一个 PCI-PCI 桥</text>
  </g>
</svg>
