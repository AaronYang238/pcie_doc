<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">DMA 写：设备把数据搬进主存（发 MWr）</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">写是 Posted、单程、不等回应；1KB 数据按 MPS=256B 拆成 4 个 MWr</text>

  <defs>
    <marker id="w12" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1c7a4a"/></marker>
    <marker id="w12b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1b4f9c"/></marker>
    <marker id="w12p" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a5cc0"/></marker>
  </defs>

  <text x="250" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">Capric 卡</text>
  <text x="720" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3b57">主机（内存 + CPU）</text>
  <line x1="250" y1="100" x2="250" y2="500" stroke="#8fd3ac" stroke-width="2"/>
  <line x1="720" y1="100" x2="720" y2="500" stroke="#8aa0bd" stroke-width="2"/>

  <!-- 步骤 -->
  <rect x="300" y="112" width="360" height="34" rx="8" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="480" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#2a3b57">① 驱动写 BAR0：设好目标地址/长度，敲 Doorbell</text>
  <line x1="720" y1="129" x2="252" y2="129" stroke="#1b4f9c" stroke-width="1.6" marker-end="url(#w12b)"/>

  <g font-size="11">
    <line x1="250" y1="180" x2="720" y2="196" stroke="#1c7a4a" stroke-width="1.8" marker-end="url(#w12)"/>
    <text x="470" y="176" text-anchor="middle" fill="#1c7a4a" font-weight="700">② MWr #1（256B，Posted）</text>
    <line x1="250" y1="220" x2="720" y2="236" stroke="#1c7a4a" stroke-width="1.8" marker-end="url(#w12)"/>
    <text x="470" y="216" text-anchor="middle" fill="#1c7a4a">MWr #2（256B）</text>
    <line x1="250" y1="260" x2="720" y2="276" stroke="#1c7a4a" stroke-width="1.8" marker-end="url(#w12)"/>
    <text x="470" y="256" text-anchor="middle" fill="#1c7a4a">MWr #3（256B）</text>
    <line x1="250" y1="300" x2="720" y2="316" stroke="#1c7a4a" stroke-width="1.8" marker-end="url(#w12)"/>
    <text x="470" y="296" text-anchor="middle" fill="#1c7a4a">MWr #4（256B）</text>
  </g>
  <text x="470" y="342" text-anchor="middle" font-size="10" fill="#8a97ab">连续 4 个 Posted 写，无需等待任何回应（写"便宜"）→ 数据落入主存缓冲</text>

  <!-- MSI -->
  <line x1="250" y1="380" x2="720" y2="396" stroke="#7a5cc0" stroke-width="2.2" marker-end="url(#w12p)"/>
  <text x="470" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5cc0">③ MSI（也是一次 Posted 写！）</text>
  <text x="470" y="416" text-anchor="middle" font-size="10" fill="#8a97ab">强序保证：MSI 不越前面的数据写 → CPU 收中断时 4 块数据都已就绪（第11章）</text>

  <rect x="600" y="430" width="240" height="34" rx="8" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="720" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#a85a17">④ 中断处理程序读数据</text>

  <!-- 小结 -->
  <rect x="60" y="486" width="840" height="76" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="80" y="510" font-size="12.5" font-weight="700" fill="#1b2a4a">关键点</text>
  <g font-size="11" fill="#33415c">
    <text x="80" y="532">• 数据写用 <tspan font-weight="700" fill="#1c7a4a">Posted MWr</tspan>，按 MPS 分片；片数 = ⌈数据量 / MPS⌉。分片越少（MPS 越大）开销越低。</text>
    <text x="80" y="552">• 完成通知用 <tspan font-weight="700" fill="#7a5cc0">MSI</tspan>（Posted 写），靠排序规则天然保证"数据先于中断可见"——无需软件同步。</text>
  </g>
</svg>
