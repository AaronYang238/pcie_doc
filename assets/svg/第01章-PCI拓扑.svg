<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">PCI 拓扑：一条被多设备"共享"的并行总线</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">HOST 主桥连接处理器域与 PCI 总线域；同一条总线上挂多个设备，靠仲裁轮流占用（对照 PCIe 的端到端）</text>

  <defs>
    <marker id="t01" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 处理器域 -->
  <rect x="360" y="82" width="240" height="66" rx="10" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="480" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#2a3b57">处理器 + 存储器（处理器域）</text>
  <text x="480" y="130" text-anchor="middle" font-size="10" fill="#3f5678">CPU / 主存 / 存储器控制器</text>

  <!-- HOST 主桥 -->
  <rect x="380" y="168" width="200" height="60" rx="10" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="480" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a85a17">HOST 主桥</text>
  <text x="480" y="212" text-anchor="middle" font-size="9.5" fill="#3f5678">两域枢纽：地址转换 + 发起配置请求</text>
  <line x1="480" y1="148" x2="480" y2="168" stroke="#5a6b86" stroke-width="2"/>

  <!-- PCI 总线 0 -->
  <line x1="80" y1="270" x2="700" y2="270" stroke="#7a5cc0" stroke-width="4"/>
  <text x="90" y="262" font-size="11" font-weight="700" fill="#7a5cc0">PCI 总线 0（共享并行介质）</text>
  <line x1="480" y1="228" x2="480" y2="270" stroke="#5a6b86" stroke-width="2"/>

  <!-- 设备们 in bus0 -->
  <g font-size="10" text-anchor="middle">
    <rect x="90" y="300" width="130" height="60" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
    <text x="155" y="324" font-weight="700" fill="#1c7a4a">PCI 设备 A</text>
    <text x="155" y="344" fill="#3f5678">Master/Target</text>
    <line x1="155" y1="270" x2="155" y2="300" stroke="#5a6b86" stroke-width="1.6"/>

    <rect x="250" y="300" width="130" height="60" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
    <text x="315" y="324" font-weight="700" fill="#1c7a4a">PCI 设备 B</text>
    <text x="315" y="344" fill="#3f5678">网卡 / 声卡…</text>
    <line x1="315" y1="270" x2="315" y2="300" stroke="#5a6b86" stroke-width="1.6"/>
  </g>

  <!-- 中央仲裁器 -->
  <rect x="600" y="238" width="120" height="56" rx="8" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="660" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">中央仲裁器</text>
  <text x="660" y="278" text-anchor="middle" font-size="9" fill="#c0392b">REQ# / GNT#</text>
  <line x1="660" y1="270" x2="660" y2="238" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 2"/>

  <!-- PCI 桥 -->
  <rect x="430" y="300" width="140" height="60" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="500" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4f9c">PCI-to-PCI 桥</text>
  <text x="500" y="344" text-anchor="middle" font-size="9" fill="#3f5678">分出下级总线</text>
  <line x1="500" y1="270" x2="500" y2="300" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- PCI 总线 1 -->
  <line x1="360" y1="400" x2="640" y2="400" stroke="#7a5cc0" stroke-width="4"/>
  <text x="360" y="392" font-size="11" font-weight="700" fill="#7a5cc0">PCI 总线 1</text>
  <line x1="500" y1="360" x2="500" y2="400" stroke="#5a6b86" stroke-width="2"/>
  <g font-size="10" text-anchor="middle">
    <rect x="380" y="424" width="120" height="52" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
    <text x="440" y="446" font-weight="700" fill="#1c7a4a">设备 C</text>
    <text x="440" y="464" fill="#3f5678">下级设备</text>
    <line x1="440" y1="400" x2="440" y2="424" stroke="#5a6b86" stroke-width="1.6"/>
    <rect x="520" y="424" width="120" height="52" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
    <text x="580" y="446" font-weight="700" fill="#1c7a4a">设备 D</text>
    <text x="580" y="464" fill="#3f5678">下级设备</text>
    <line x1="580" y1="400" x2="580" y2="424" stroke="#5a6b86" stroke-width="1.6"/>
  </g>

  <!-- 底注 -->
  <rect x="40" y="500" width="880" height="48" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="522" font-size="11.5" font-weight="700" fill="#1b2a4a">对照埋点：</text>
  <text x="145" y="522" font-size="11" fill="#33415c">同一总线是<tspan font-weight="700" fill="#7a5cc0">共享介质</tspan>——同一时刻只一个 Master 占用，靠仲裁排队；电气负载限制扇出。</text>
  <text x="60" y="540" font-size="10.5" fill="#8a97ab">📘 正是"共享 + 负载 + 仲裁"的物理瓶颈催生了 PCIe 的端到端串行链路（第04章）。</text>
</svg>
