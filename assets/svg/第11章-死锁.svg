<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">死锁怎么发生，排序规则又怎么避免它</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">关键：Completion 必须能"绕过"被卡住的 Non-Posted，且各类事务有独立信用池</text>

  <defs>
    <marker id="d11" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="d11g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1c7a4a"/></marker>
  </defs>

  <!-- 左：死锁场景 -->
  <rect x="40" y="86" width="430" height="240" rx="10" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="255" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">✗ 若不分池 / 不许超越</text>
  <rect x="70" y="128" width="150" height="50" rx="7" fill="#fff" stroke="#e0b0b0"/><text x="145" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#33415c">设备 A</text><text x="145" y="167" text-anchor="middle" font-size="9.5" fill="#8a97ab">发了读，等 Completion</text>
  <rect x="290" y="128" width="150" height="50" rx="7" fill="#fff" stroke="#e0b0b0"/><text x="365" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#33415c">设备 B</text><text x="365" y="167" text-anchor="middle" font-size="9.5" fill="#8a97ab">缓冲被 Posted 塞满</text>
  <text x="255" y="210" text-anchor="middle" font-size="10.5" fill="#33415c">B 的缓冲被一堆 Posted 写占满 →</text>
  <text x="255" y="230" text-anchor="middle" font-size="10.5" fill="#33415c">要回给 A 的 Completion <tspan font-weight="700" fill="#c0392b">挤不进去</tspan> →</text>
  <text x="255" y="250" text-anchor="middle" font-size="10.5" fill="#33415c">A 一直等 Completion、不释放资源 →</text>
  <text x="255" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">互相等待，永久卡死（死锁）</text>
  <line x1="220" y1="300" x2="290" y2="300" stroke="#c0392b" stroke-width="2" marker-end="url(#d11)"/>
  <line x1="290" y1="312" x2="220" y2="312" stroke="#c0392b" stroke-width="2" marker-end="url(#d11)"/>

  <!-- 右：如何避免 -->
  <rect x="490" y="86" width="430" height="240" rx="10" fill="#f0faf4" stroke="#8fd3ac"/>
  <text x="705" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">✓ PCIe 的两道保险</text>
  <g font-size="11" fill="#33415c">
    <rect x="510" y="126" width="390" height="42" rx="7" fill="#fff" stroke="#a9dcc0"/>
    <text x="524" y="144" font-weight="700" fill="#1c7a4a">① 独立信用池（第09章 六池）</text>
    <text x="524" y="160" font-size="10">Completion 有专属信用，不被 Posted 挤占</text>
    <rect x="510" y="176" width="390" height="42" rx="7" fill="#fff" stroke="#a9dcc0"/>
    <text x="524" y="194" font-weight="700" fill="#1c7a4a">② 排序表强制"Yes"（本章）</text>
    <text x="524" y="210" font-size="10">Posted / Completion 必须能越过 Non-Posted</text>
    <text x="510" y="242" font-size="10.5">于是被卡的读，不会挡住它自己在等的 Completion；</text>
    <text x="510" y="262" font-size="10.5">Completion 总能向前流动 → 循环等待被打破。</text>
    <text x="510" y="290" font-size="12" font-weight="700" fill="#14663f">链路持续流动，不死锁</text>
  </g>
  <line x1="620" y1="304" x2="790" y2="304" stroke="#1c7a4a" stroke-width="2" marker-end="url(#d11g)"/>
  <text x="705" y="298" text-anchor="middle" font-size="9.5" fill="#1c7a4a">Completion 畅通</text>

  <!-- 底部原理 -->
  <rect x="40" y="344" width="880" height="212" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="370" font-size="13" font-weight="700" fill="#1b2a4a">死锁的本质：循环等待 + 资源不可抢占</text>
  <g font-size="11.3" fill="#33415c">
    <text x="60" y="396">经典死锁四条件里，PCIe 用规则打破了两条：</text>
    <text x="60" y="422">• <tspan font-weight="700">打破"占有并等待"</tspan>：Completion 独立信用池 → 它的推进不依赖 Posted/Non-Posted 的资源。</text>
    <text x="60" y="448">• <tspan font-weight="700">打破"循环等待"</tspan>：排序表强制 Posted/Completion 能越过 Non-Posted → 后到的完成不会被前面阻塞的读挡死。</text>
    <text x="60" y="480" fill="#5a6b86">💡 这也解释了排序表里那两个刺眼的 <tspan font-weight="700" fill="#14663f">Yes（必须）</tspan> 不是可选优化，而是<tspan font-weight="700">防死锁的硬性要求</tspan>。</text>
    <text x="60" y="506" fill="#5a6b86">💡 而 PCI 时代因为没有这套彻底的分类与信用机制，桥缓冲管理不当就可能死锁（本章 11.2 讲的历史教训）。</text>
    <text x="60" y="534" fill="#8a97ab" font-size="10.5">📘 Gen6+ Flit 模式：承载单位变 Flit，但"Completion 必须能独立流动"这条防死锁原则不变。</text>
  </g>
</svg>
