<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="980" height="560" rx="14" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="490" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf1fb">PCIe 技术演进主线（Gen1 → Gen5，附 Gen6/7 展望）</text>
  <text x="490" y="66" text-anchor="middle" font-size="12.5" fill="#8fa6c8">速率 / 编码 / 关键机制的分代跃迁 —— 本笔记以 Gen5 为现代主线基准</text>

  <!-- 列标题 -->
  <g font-size="12" fill="#8fa6c8" text-anchor="middle" font-weight="600">
    <text x="140" y="104">代际 (Gen)</text>
    <text x="300" y="104">每 Lane 速率</text>
    <text x="470" y="104">编码 / 调制</text>
    <text x="670" y="104">关键机制</text>
    <text x="860" y="104">x16 单向带宽</text>
  </g>
  <line x1="40" y1="114" x2="940" y2="114" stroke="#2c4568"/>

  <!-- rows: Gen1-5 为主体 -->
  <g font-size="13" fill="#dce6f5" text-anchor="middle">
    <rect x="40" y="122" width="900" height="46" rx="7" fill="#15263d"/>
    <text x="140" y="150" font-weight="700" fill="#7fd1a8">Gen1 (2003)</text>
    <text x="300" y="150">2.5 GT/s</text>
    <text x="470" y="150">8b/10b (NRZ)</text>
    <text x="670" y="150" fill="#6f86a8">原书基线</text>
    <text x="860" y="150">≈ 4 GB/s</text>

    <rect x="40" y="174" width="900" height="46" rx="7" fill="#122036"/>
    <text x="140" y="202" font-weight="700" fill="#7fd1a8">Gen2 (2007)</text>
    <text x="300" y="202">5.0 GT/s</text>
    <text x="470" y="202">8b/10b (NRZ)</text>
    <text x="670" y="202" fill="#6f86a8">—</text>
    <text x="860" y="202">≈ 8 GB/s</text>

    <rect x="40" y="226" width="900" height="46" rx="7" fill="#15263d"/>
    <text x="140" y="254" font-weight="700" fill="#8bc6f0">Gen3 (2010)</text>
    <text x="300" y="254">8.0 GT/s</text>
    <text x="470" y="254" fill="#ffd479">128b/130b (NRZ)</text>
    <text x="670" y="254" fill="#8fa6c8">引入均衡 EQ、扰码</text>
    <text x="860" y="254">≈ 16 GB/s</text>

    <rect x="40" y="278" width="900" height="46" rx="7" fill="#122036"/>
    <text x="140" y="306" font-weight="700" fill="#8bc6f0">Gen4 (2017)</text>
    <text x="300" y="306">16 GT/s</text>
    <text x="470" y="306">128b/130b (NRZ)</text>
    <text x="670" y="306" fill="#8fa6c8">10-bit Tag、Retimer 普及</text>
    <text x="860" y="306">≈ 31.5 GB/s</text>

    <!-- Gen5 高亮主基线行 -->
    <rect x="40" y="330" width="900" height="64" rx="8" fill="#1a3050" stroke="#8bc6f0" stroke-width="2"/>
    <text x="140" y="358" font-weight="700" font-size="15" fill="#8bc6f0">Gen5 (2019)</text>
    <text x="140" y="380" font-size="10.5" fill="#ffd479" font-weight="700">⭐ 当前主流部署基线</text>
    <text x="300" y="368" font-size="14" font-weight="700">32 GT/s</text>
    <text x="470" y="368" font-size="14" fill="#ffd479">128b/130b (NRZ)</text>
    <text x="670" y="360" fill="#dce6f5">更严格信号完整性</text>
    <text x="670" y="380" font-size="11" fill="#8fa6c8">Scaled FC、L1 子状态成熟</text>
    <text x="860" y="368" font-size="14" font-weight="700">≈ 63 GB/s</text>
  </g>

  <!-- Gen6/7 展望条带 -->
  <rect x="40" y="410" width="900" height="98" rx="10" fill="#101c14" stroke="#3a5a2a"/>
  <text x="60" y="436" font-size="13" font-weight="700" fill="#c6e88a">🔭 Gen6/7 展望（本笔记以"展望"形式呈现，非当前主线）</text>
  <g font-size="11.5" fill="#c6d2e6">
    <text x="60" y="462">Gen6 (2022)：64 GT/s · <tspan fill="#ff9e6b">PAM4</tspan> 4 电平调制 · 强制 <tspan fill="#c6e88a">FEC + Flit 模式</tspan>（256B 定长封装）· x16 ≈ 121 GB/s</text>
    <text x="60" y="486">Gen7 (2025, 7.0)：128 GT/s · PAM4 · 沿用 Flit + FEC · x16 ≈ 242 GB/s —— 详见各章末尾「🔭 Gen6/7 展望」块</text>
  </g>

  <text x="490" y="536" text-anchor="middle" font-size="11" fill="#6f86a8">注：带宽为扣除编码开销后的近似单向值（x16）。Gen3–5 的 128b/130b 编码开销仅 ~1.5%，是现代 PCIe 的效率基石。</text>
</svg>
