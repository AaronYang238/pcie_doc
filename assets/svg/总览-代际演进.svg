<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="980" height="520" rx="14" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="490" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf1fb">PCIe 技术演进主线（Gen1 → Gen7）</text>
  <text x="490" y="66" text-anchor="middle" font-size="12.5" fill="#8fa6c8">速率 / 编码 / 关键机制的分代跃迁 —— 现代化补充的锚点</text>

  <!-- 列标题 -->
  <g font-size="12" fill="#8fa6c8" text-anchor="middle" font-weight="600">
    <text x="140" y="104">代际 (Gen)</text>
    <text x="300" y="104">每 Lane 速率</text>
    <text x="470" y="104">编码 / 调制</text>
    <text x="670" y="104">FEC / Flit</text>
    <text x="860" y="104">x16 单向带宽</text>
  </g>
  <line x1="40" y1="114" x2="940" y2="114" stroke="#2c4568"/>

  <!-- rows -->
  <g font-size="13" fill="#dce6f5" text-anchor="middle">
    <rect x="40" y="122" width="900" height="48" rx="7" fill="#15263d"/>
    <text x="140" y="151" font-weight="700" fill="#7fd1a8">Gen1 (2003)</text>
    <text x="300" y="151">2.5 GT/s</text>
    <text x="470" y="151">8b/10b (NRZ)</text>
    <text x="670" y="151" fill="#6f86a8">—</text>
    <text x="860" y="151">≈ 4 GB/s</text>
    <rect x="40" y="176" width="900" height="48" rx="7" fill="#122036"/>
    <text x="140" y="205" font-weight="700" fill="#7fd1a8">Gen2 (2007)</text>
    <text x="300" y="205">5.0 GT/s</text>
    <text x="470" y="205">8b/10b (NRZ)</text>
    <text x="670" y="205" fill="#6f86a8">—</text>
    <text x="860" y="205">≈ 8 GB/s</text>
    <rect x="40" y="230" width="900" height="48" rx="7" fill="#15263d"/>
    <text x="140" y="259" font-weight="700" fill="#8bc6f0">Gen3 (2010)</text>
    <text x="300" y="259">8.0 GT/s</text>
    <text x="470" y="259" fill="#ffd479">128b/130b (NRZ)</text>
    <text x="670" y="259" fill="#6f86a8">— · 引入均衡 EQ</text>
    <text x="860" y="259">≈ 16 GB/s</text>
    <rect x="40" y="284" width="900" height="48" rx="7" fill="#122036"/>
    <text x="140" y="313" font-weight="700" fill="#8bc6f0">Gen4 (2017)</text>
    <text x="300" y="313">16 GT/s</text>
    <text x="470" y="313">128b/130b (NRZ)</text>
    <text x="670" y="313" fill="#6f86a8">—</text>
    <text x="860" y="313">≈ 32 GB/s</text>
    <rect x="40" y="338" width="900" height="48" rx="7" fill="#15263d"/>
    <text x="140" y="367" font-weight="700" fill="#8bc6f0">Gen5 (2019)</text>
    <text x="300" y="367">32 GT/s</text>
    <text x="470" y="367">128b/130b (NRZ)</text>
    <text x="670" y="367" fill="#6f86a8">—</text>
    <text x="860" y="367">≈ 64 GB/s</text>
    <rect x="40" y="392" width="900" height="48" rx="7" fill="#1d2f18"/>
    <text x="140" y="421" font-weight="700" fill="#c6e88a">Gen6 (2022)</text>
    <text x="300" y="421">64 GT/s</text>
    <text x="470" y="421" fill="#ff9e6b">PAM4</text>
    <text x="670" y="421" fill="#c6e88a">FEC + Flit 模式</text>
    <text x="860" y="421">≈ 128 GB/s</text>
    <rect x="40" y="446" width="900" height="48" rx="7" fill="#241a2e"/>
    <text x="140" y="475" font-weight="700" fill="#d9a7f0">Gen7 (2025, 7.0)</text>
    <text x="300" y="475">128 GT/s</text>
    <text x="470" y="475" fill="#ff9e6b">PAM4</text>
    <text x="670" y="475" fill="#c6e88a">FEC + Flit 模式</text>
    <text x="860" y="475">≈ 256 GB/s</text>
  </g>
  <text x="490" y="510" text-anchor="middle" font-size="11" fill="#6f86a8">注：带宽为近似值（x16、单向、扣除编码开销前后量级）。Flit 模式自 Gen6 起对所有速率强制启用。</text>
</svg>
