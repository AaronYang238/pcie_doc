<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="940" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">六类信用池：为什么流控要分这么细</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">{Posted / Non-Posted / Completion} × {Header / Data} = 6 种各自独立计量的信用</text>

  <!-- 矩阵表头 -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="250" y="86" width="330" height="40" rx="6" fill="#dbe8fb" stroke="#93b7f0"/><text x="415" y="111" fill="#1b4f9c">Header 信用（1 单位 = 1 个头）</text>
    <rect x="590" y="86" width="330" height="40" rx="6" fill="#dbe8fb" stroke="#93b7f0"/><text x="755" y="111" fill="#1b4f9c">Data 信用（1 单位 = 16 字节/4DW）</text>
  </g>

  <!-- 行 Posted -->
  <rect x="40" y="134" width="200" height="120" rx="8" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="140" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">Posted</text>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#3f5678">MWr / Msg</text>
  <rect x="250" y="134" width="330" height="120" rx="8" fill="#f0faf4" stroke="#a9dcc0"/>
  <text x="415" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">PH</text>
  <text x="415" y="208" text-anchor="middle" font-size="10.5" fill="#3f5678">Posted 头信用</text>
  <rect x="590" y="134" width="330" height="120" rx="8" fill="#f0faf4" stroke="#a9dcc0"/>
  <text x="755" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">PD</text>
  <text x="755" y="208" text-anchor="middle" font-size="10.5" fill="#3f5678">Posted 数据信用</text>

  <!-- 行 Non-Posted -->
  <rect x="40" y="264" width="200" height="120" rx="8" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="140" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a17">Non-Posted</text>
  <text x="140" y="340" text-anchor="middle" font-size="10" fill="#3f5678">MRd / Cfg / IO</text>
  <rect x="250" y="264" width="330" height="120" rx="8" fill="#fff7ec" stroke="#f0c193"/>
  <text x="415" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a17">NPH</text>
  <text x="415" y="338" text-anchor="middle" font-size="10.5" fill="#3f5678">Non-Posted 头信用</text>
  <rect x="590" y="264" width="330" height="120" rx="8" fill="#fff7ec" stroke="#f0c193"/>
  <text x="755" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a17">NPD</text>
  <text x="755" y="338" text-anchor="middle" font-size="10.5" fill="#3f5678">Non-Posted 数据信用（读请求无数据→常少用）</text>

  <!-- 行 Completion -->
  <rect x="40" y="394" width="200" height="120" rx="8" fill="#efe9f9" stroke="#c4b1e8"/>
  <text x="140" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0">Completion</text>
  <text x="140" y="470" text-anchor="middle" font-size="10" fill="#3f5678">Cpl / CplD</text>
  <rect x="250" y="394" width="330" height="120" rx="8" fill="#f3eefb" stroke="#c4b1e8"/>
  <text x="415" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0">CplH</text>
  <text x="415" y="468" text-anchor="middle" font-size="10.5" fill="#3f5678">Completion 头信用</text>
  <rect x="590" y="394" width="330" height="120" rx="8" fill="#f3eefb" stroke="#c4b1e8"/>
  <text x="755" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5cc0">CplD</text>
  <text x="755" y="468" text-anchor="middle" font-size="10.5" fill="#3f5678">Completion 数据信用</text>

  <!-- 底部：为什么分开 -->
  <text x="470" y="548" text-anchor="middle" font-size="11.8" fill="#33415c"><tspan font-weight="700">为什么分开？</tspan> 三类事务的缓冲若共用，一类被塞满会拖死另一类 → 死锁。分池 = 各走各的道，Completion 永远能流动（第11章）。</text>
  <text x="470" y="568" text-anchor="middle" font-size="10.5" fill="#8a97ab">头与数据分开，是因为一个 TLP 的头和数据占的缓冲量不同；某些池可通告"无限信用（Infinite）"以彻底避免死锁。</text>
</svg>
