<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">DMA 与 Cache 一致性：设备写主存，CPU 的 Cache 怎么办？</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">危险场景：设备 DMA 写了内存，但 CPU 的 Cache 里还留着这块内存的旧副本——读到旧数据。靠 snoop 侦听解决</text>

  <defs>
    <marker id="c03" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6b86"/></marker>
    <marker id="c03r" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>

  <!-- CPU/Cache -->
  <rect x="40" y="88" width="240" height="150" rx="10" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="160" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#2a3b57">CPU + Cache</text>
  <rect x="62" y="130" width="196" height="42" rx="6" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#c0392b">Cache 行：地址 X 的旧副本</text>
  <text x="160" y="166" text-anchor="middle" font-size="9" fill="#c0392b">（可能是 Modified 脏数据）</text>
  <text x="160" y="196" text-anchor="middle" font-size="9.5" fill="#5a6b86">若不处理，CPU 读 X</text>
  <text x="160" y="212" text-anchor="middle" font-size="9.5" fill="#5a6b86">会读到 Cache 里的旧值 ✗</text>

  <!-- 内存 -->
  <rect x="360" y="88" width="240" height="150" rx="10" fill="#eef3fa" stroke="#aab8cc"/>
  <text x="480" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#33415c">主存 DRAM</text>
  <rect x="382" y="134" width="196" height="60" rx="6" fill="#fff" stroke="#aab8cc"/>
  <text x="480" y="158" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33415c">地址 X</text>
  <text x="480" y="176" text-anchor="middle" font-size="9.5" fill="#1c7a4a">设备要往这里写新数据</text>

  <!-- 设备 -->
  <rect x="680" y="88" width="240" height="150" rx="10" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="800" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1c7a4a">设备（DMA Master）</text>
  <text x="800" y="150" text-anchor="middle" font-size="10.5" fill="#3f5678">DMA 写地址 X</text>
  <text x="800" y="170" text-anchor="middle" font-size="10.5" fill="#3f5678">（如网卡收到的新包）</text>
  <text x="800" y="200" text-anchor="middle" font-size="9.5" fill="#8a97ab">发 MWr → 目标 = X</text>

  <!-- 流程箭头 -->
  <line x1="680" y1="150" x2="600" y2="150" stroke="#5a6b86" stroke-width="2" marker-end="url(#c03)"/>
  <text x="640" y="142" text-anchor="middle" font-size="9" fill="#1c7a4a">① DMA 写 X</text>

  <!-- snoop -->
  <rect x="300" y="270" width="360" height="70" rx="10" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="480" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a85a17">② 一致性硬件发起 snoop（侦听）</text>
  <text x="480" y="316" text-anchor="middle" font-size="10" fill="#33415c">检查："有谁的 Cache 里缓存了地址 X？"</text>
  <text x="480" y="332" text-anchor="middle" font-size="9" fill="#8a97ab">RC / 内存控制器 / 一致性总线负责</text>
  <line x1="480" y1="238" x2="480" y2="270" stroke="#f0c193" stroke-width="1.8" marker-end="url(#c03)"/>

  <!-- 命中处理两分支 -->
  <rect x="80" y="374" width="380" height="120" rx="10" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">③a 命中且 Cache 行是"干净"的</text>
  <text x="270" y="422" text-anchor="middle" font-size="10.5" fill="#33415c">→ 直接 <tspan font-weight="700">Invalidate</tspan>（作废该 Cache 行）</text>
  <text x="270" y="442" text-anchor="middle" font-size="10.5" fill="#33415c">CPU 下次读 X 时重新从内存取新值 ✔</text>
  <text x="270" y="470" text-anchor="middle" font-size="9.5" fill="#8a97ab">最常见、开销最小</text>
  <line x1="380" y1="340" x2="300" y2="374" stroke="#c0392b" stroke-width="1.6" marker-end="url(#c03r)"/>

  <rect x="500" y="374" width="380" height="120" rx="10" fill="#fef3ec" stroke="#f0c193"/>
  <text x="690" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#a85a17">③b 命中且 Cache 行是"脏(Modified)"的</text>
  <text x="690" y="422" text-anchor="middle" font-size="10.5" fill="#33415c">→ 需正确合并/回写策略，避免脏数据</text>
  <text x="690" y="442" text-anchor="middle" font-size="10.5" fill="#33415c">覆盖设备刚写入的新值（顺序敏感）</text>
  <text x="690" y="470" text-anchor="middle" font-size="9.5" fill="#8a97ab">最棘手；硬件一致性协议(MESI)保证正确</text>
  <line x1="580" y1="340" x2="660" y2="374" stroke="#c0392b" stroke-width="1.6" marker-end="url(#c03r)"/>

  <!-- 底注 -->
  <rect x="40" y="506" width="880" height="44" rx="10" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="60" y="524" font-size="11" fill="#c6d2e6">📘 <tspan font-weight="700" fill="#eaf1fb">No Snoop（NS）</tspan>属性（PCIe TLP Attr）= 设备"担保"该内存不在任何 Cache 里，可跳过 snoop 提速——用错=读到旧数据。</text>
  <text x="60" y="540" font-size="10" fill="#8bc6f0">现代 x86 的 DMA 默认硬件一致（snoop 自动），但驱动仍应写 dma_sync_* 以求可移植（第12章）。</text>
</svg>
