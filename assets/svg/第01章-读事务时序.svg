<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">PCI 存储器读时序：一次握手怎么走</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#5a6b86">地址期发地址，数据期靠 IRDY#/TRDY# 双方"都就绪"才传一拍；未就绪就插入等待周期</text>

  <!-- 时钟格 -->
  <g stroke="#e2e8f2" stroke-width="1">
    <line x1="150" y1="90" x2="150" y2="470"/><line x1="240" y1="90" x2="240" y2="470"/>
    <line x1="330" y1="90" x2="330" y2="470"/><line x1="420" y1="90" x2="420" y2="470"/>
    <line x1="510" y1="90" x2="510" y2="470"/><line x1="600" y1="90" x2="600" y2="470"/>
    <line x1="690" y1="90" x2="690" y2="470"/><line x1="780" y1="90" x2="780" y2="470"/>
    <line x1="870" y1="90" x2="870" y2="470"/>
  </g>
  <g font-size="9.5" fill="#8a97ab" text-anchor="middle">
    <text x="195" y="86">T1</text><text x="285" y="86">T2</text><text x="375" y="86">T3</text><text x="465" y="86">T4</text>
    <text x="555" y="86">T5</text><text x="645" y="86">T6</text><text x="735" y="86">T7</text><text x="825" y="86">T8</text>
  </g>

  <!-- CLK -->
  <text x="60" y="112" font-size="11" font-weight="700" fill="#33415c">CLK</text>
  <polyline points="150,116 150,100 195,100 195,116 240,116 240,100 285,100 285,116 330,116 330,100 375,100 375,116 420,116 420,100 465,100 465,116 510,116 510,100 555,100 555,116 600,116 600,100 645,100 645,116 690,116 690,100 735,100 735,116 780,116 780,100 825,100 825,116 870,116" fill="none" stroke="#5a6b86" stroke-width="1.6"/>

  <!-- FRAME# -->
  <text x="60" y="164" font-size="11" font-weight="700" fill="#a85a17">FRAME#</text>
  <polyline points="150,150 195,150 195,175 690,175 690,150 870,150" fill="none" stroke="#a85a17" stroke-width="2"/>
  <text x="240" y="145" font-size="9" fill="#a85a17">拉低=事务开始</text>
  <text x="640" y="145" font-size="9" fill="#a85a17">末拍前释放</text>

  <!-- AD -->
  <text x="60" y="220" font-size="11" font-weight="700" fill="#1b4f9c">AD[31:0]</text>
  <g fill="#dbe8fb" stroke="#93b7f0">
    <polygon points="195,205 285,205 285,231 195,231"/>
  </g>
  <text x="240" y="223" font-size="9" text-anchor="middle" fill="#1b4f9c">地址</text>
  <text x="240" y="245" font-size="8.5" text-anchor="middle" fill="#8a97ab">地址期</text>
  <g fill="#bfe3cd" stroke="#4a9a6a">
    <polygon points="420,205 510,205 510,231 420,231"/>
    <polygon points="600,205 690,205 690,231 600,231"/>
    <polygon points="690,205 780,205 780,231 690,231"/>
  </g>
  <text x="465" y="223" font-size="9" text-anchor="middle" fill="#14663f">数据1</text>
  <text x="645" y="223" font-size="9" text-anchor="middle" fill="#14663f">数据2</text>
  <text x="735" y="223" font-size="9" text-anchor="middle" fill="#14663f">数据3</text>
  <rect x="330" y="205" width="90" height="26" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="375" y="223" font-size="8.5" text-anchor="middle" fill="#c0392b">转向周期</text>

  <!-- IRDY# -->
  <text x="60" y="290" font-size="11" font-weight="700" fill="#1c7a4a">IRDY#</text>
  <polyline points="150,276 420,276 420,301 870,301" fill="none" stroke="#1c7a4a" stroke-width="2"/>
  <text x="500" y="296" font-size="9" fill="#1c7a4a">Master 就绪（可收数据）</text>

  <!-- TRDY# -->
  <text x="60" y="346" font-size="11" font-weight="700" fill="#7a5cc0">TRDY#</text>
  <polyline points="150,332 420,332 420,357 510,357 510,332 600,332 600,357 780,357 780,332 870,332" fill="none" stroke="#7a5cc0" stroke-width="2"/>
  <text x="640" y="378" font-size="9" fill="#c0392b" text-anchor="middle">T6：TRDY# 抬高=Target 未就绪→插入等待周期（无数据传）</text>

  <!-- DEVSEL# -->
  <text x="60" y="402" font-size="11" font-weight="700" fill="#2a3b57">DEVSEL#</text>
  <polyline points="150,388 330,388 330,413 780,413 780,388 870,388" fill="none" stroke="#2a3b57" stroke-width="2"/>
  <text x="420" y="405" font-size="9" fill="#2a3b57">Target 认领地址（"我在"）</text>

  <!-- 数据传拍标注 -->
  <g font-size="8.5" fill="#14663f" text-anchor="middle">
    <line x1="465" y1="430" x2="465" y2="235" stroke="#8fd3ac" stroke-dasharray="3 2"/>
    <line x1="645" y1="430" x2="645" y2="235" stroke="#8fd3ac" stroke-dasharray="3 2"/>
    <line x1="735" y1="430" x2="735" y2="235" stroke="#8fd3ac" stroke-dasharray="3 2"/>
    <text x="465" y="444">传拍✔</text><text x="645" y="444">传拍✔</text><text x="735" y="444">传拍✔</text>
  </g>

  <!-- 底注 -->
  <rect x="40" y="486" width="880" height="60" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="510" font-size="11.5" font-weight="700" fill="#1b2a4a">读懂一句话：</text>
  <text x="160" y="510" font-size="11" fill="#33415c"><tspan font-weight="700" fill="#1c7a4a">IRDY#</tspan>（发起方就绪）与 <tspan font-weight="700" fill="#7a5cc0">TRDY#</tspan>（目标就绪）<tspan font-weight="700">同时有效</tspan>的那一拍，才真正传一个数据。</text>
  <text x="60" y="530" font-size="10.5" fill="#8a97ab">任一方没就绪就"插等待周期"——这种严格握手正是并行总线随频率提升越来越难做快的原因（催生 PCIe 串行化）。</text>
</svg>
