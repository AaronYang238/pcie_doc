<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="620" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">MSI vs MSI-X：从"一组连续向量"到"每向量独立"</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">中断的本质都是"往指定地址写指定数据"（一次 Posted 写 TLP），区别在于向量的数量与灵活度</text>

  <!-- MSI -->
  <rect x="40" y="82" width="430" height="470" rx="12" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="255" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1b4f9c">MSI（传统）</text>
  <text x="255" y="130" text-anchor="middle" font-size="10.5" fill="#3f5678">结构全在配置空间的 Capability 里</text>

  <rect x="70" y="146" width="370" height="30" rx="5" fill="#dbe8fb" stroke="#93b7f0"/>
  <text x="255" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1b4f9c">Message Control（使能 / 向量数 / 屏蔽能力）</text>
  <rect x="70" y="182" width="370" height="30" rx="5" fill="#ffffff" stroke="#b7cdf0"/>
  <text x="255" y="202" text-anchor="middle" font-size="11" fill="#33415c">Message Address（32 位，可扩 64）</text>
  <rect x="70" y="218" width="370" height="30" rx="5" fill="#ffffff" stroke="#b7cdf0"/>
  <text x="255" y="238" text-anchor="middle" font-size="11" fill="#33415c">Message Upper Address（64 位时）</text>
  <rect x="70" y="254" width="370" height="30" rx="5" fill="#ffffff" stroke="#b7cdf0"/>
  <text x="255" y="274" text-anchor="middle" font-size="11" fill="#33415c">Message Data（16 位）</text>
  <rect x="70" y="290" width="370" height="30" rx="5" fill="#eef3f9" stroke="#c7d0dd"/>
  <text x="255" y="310" text-anchor="middle" font-size="10.5" fill="#5a6b86">（可选）Mask / Pending Bits</text>

  <g font-size="11" fill="#33415c">
    <text x="60" y="352" font-weight="700" fill="#1b4f9c">特点：</text>
    <text x="70" y="376">• 向量最多 <tspan font-weight="700">32 个</tspan>（且必须 2 的幂）</text>
    <text x="70" y="400">• <tspan font-weight="700">向量连续</tspan>：所有向量共用一个 Address，</text>
    <text x="88" y="420">Data 的低位 = 基值 + 向量号</text>
    <text x="70" y="444">• 屏蔽能力弱（未必支持每向量屏蔽）</text>
    <text x="70" y="468">• 不同向量<tspan font-weight="700">无法各绑不同 CPU</tspan></text>
    <rect x="70" y="486" width="370" height="48" rx="7" fill="#f0f6ff" stroke="#93b7f0"/>
    <text x="80" y="506" font-size="10.5" fill="#1b4f9c">适合：中断源少、不需要多队列亲和的</text>
    <text x="80" y="524" font-size="10.5" fill="#1b4f9c">简单设备</text>
  </g>

  <!-- MSI-X -->
  <rect x="490" y="82" width="430" height="470" rx="12" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="705" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1c7a4a">MSI-X（现代主流）</text>
  <text x="705" y="130" text-anchor="middle" font-size="10.5" fill="#3f5678">Table 与 PBA 放在 BAR 指定的 MMIO 区</text>

  <rect x="520" y="146" width="370" height="30" rx="5" fill="#dbe8fb" stroke="#8fd3ac"/>
  <text x="705" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1c7a4a">MSI-X Capability（Enable / Table Size / BIR 指针）</text>

  <text x="705" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#1c7a4a">MSI-X Table（在 BAR 里，最多 2048 项）</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="520" y="204" width="370" height="26" fill="#ffffff" stroke="#a9dcc0"/><text x="705" y="221">项0：Addr(64) | Data(32) | Vector Control(屏蔽)</text>
    <rect x="520" y="230" width="370" height="26" fill="#f0faf4" stroke="#a9dcc0"/><text x="705" y="247">项1：Addr | Data | Ctrl —— 各自独立！</text>
    <rect x="520" y="256" width="370" height="26" fill="#ffffff" stroke="#a9dcc0"/><text x="705" y="273">项2：Addr | Data | Ctrl</text>
    <rect x="520" y="282" width="370" height="20" fill="#eef3f9" stroke="#c7d0dd"/><text x="705" y="296">… 最多 2048 项</text>
  </g>
  <rect x="520" y="310" width="370" height="26" rx="5" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="705" y="327" text-anchor="middle" font-size="10.5" fill="#a85a17">PBA（Pending Bit Array）：待决中断位图</text>

  <g font-size="11" fill="#33415c">
    <text x="510" y="360" font-weight="700" fill="#1c7a4a">特点：</text>
    <text x="520" y="384">• 向量最多 <tspan font-weight="700">2048 个</tspan></text>
    <text x="520" y="408">• <tspan font-weight="700">每向量独立</tspan> Address / Data / Mask</text>
    <text x="520" y="432">• 每向量可<tspan font-weight="700">单独屏蔽</tspan>、单独绑 CPU</text>
    <text x="520" y="456">• → 天生适配<tspan font-weight="700">多队列 + CPU 亲和</tspan></text>
    <rect x="520" y="474" width="370" height="60" rx="7" fill="#f0faf4" stroke="#8fd3ac"/>
    <text x="530" y="494" font-size="10.5" fill="#14663f">适合：多队列网卡、NVMe —— 每队列一个</text>
    <text x="530" y="512" font-size="10.5" fill="#14663f">向量绑一个 CPU 核，收发并行、无锁竞争。</text>
    <text x="530" y="528" font-size="10" fill="#8a97ab">这就是现代设备一律用 MSI-X 的原因。</text>
  </g>
</svg>
