<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="980" height="600" rx="14" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf1fb">线路编码演进：8b/10b → 128b/130b（当前主流），PAM4 为展望</text>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#8fa6c8">📘 原书基线是 8b/10b；Gen3–5 的 128b/130b 是今天部署的绝对主流 —— 这是新旧对照的重心</text>

  <!-- 8b/10b 历史基线 -->
  <rect x="40" y="82" width="270" height="410" rx="10" fill="#15263d" stroke="#2c4568"/>
  <text x="175" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#7fd1a8">8b/10b（Gen1/2）</text>
  <text x="175" y="130" text-anchor="middle" font-size="10.5" fill="#8fa6c8">2.5 / 5 GT/s · NRZ · 历史基线</text>
  <g font-size="11" fill="#c6d2e6">
    <text x="58" y="160" font-weight="700" fill="#7fd1a8">原理</text>
    <text x="58" y="180">每 8 bit 映射为 10 bit 符号</text>
    <text x="58" y="198">保证 DC 平衡 + 足够跳变</text>
    <text x="58" y="216">（供接收端恢复时钟）</text>
    <text x="58" y="242" font-weight="700" fill="#7fd1a8">成帧</text>
    <text x="58" y="262">用控制字符 K-code</text>
    <text x="58" y="280">（COM/STP/SDP/END…）</text>
    <text x="58" y="306" font-weight="700" fill="#7fd1a8">调制</text>
    <text x="58" y="326">NRZ：每符号 1 bit（2 电平）</text>
    <text x="58" y="354" font-weight="700" fill="#f0a0a0">编码开销</text>
    <text x="58" y="376" font-size="15" font-weight="700" fill="#ff9e6b">20%</text>
    <text x="58" y="396" font-size="10" fill="#8fa6c8">(10 位里 2 位是开销)</text>
    <text x="58" y="426" font-weight="700" fill="#7fd1a8">同步</text>
    <text x="58" y="446">符号本身自带跳变</text>
    <text x="58" y="464">Running Disparity 平衡</text>
  </g>

  <!-- 128b/130b 主流基线（最宽列，加高亮框） -->
  <rect x="325" y="82" width="380" height="410" rx="10" fill="#1a3050" stroke="#8bc6f0" stroke-width="2"/>
  <text x="515" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#8bc6f0">128b/130b（Gen3–5）⭐ 当前主流</text>
  <text x="515" y="130" text-anchor="middle" font-size="10.5" fill="#ffd479">8 / 16 / 32 GT/s · NRZ —— Gen5 = 32 GT/s</text>
  <g font-size="11" fill="#dce6f5">
    <text x="345" y="160" font-weight="700" fill="#8bc6f0">原理</text>
    <text x="345" y="180">128 bit 数据 + 2 bit 同步头 = 130 bit 一个块</text>
    <text x="345" y="198">同步头 01=数据块 / 10=Ordered Set</text>
    <text x="345" y="224" font-weight="700" fill="#8bc6f0">成帧</text>
    <text x="345" y="244">废弃 K-code；改用 STP/END 令牌 + 块对齐</text>
    <text x="345" y="270" font-weight="700" fill="#8bc6f0">扰码（强制）</text>
    <text x="345" y="290">LFSR 扰码打散长 0/长 1，保证跳变密度</text>
    <text x="345" y="308">与频谱扩展 —— 时钟恢复不再依赖编码本身</text>
    <text x="345" y="334" font-weight="700" fill="#9fe0bd">编码开销</text>
    <text x="345" y="358" font-size="17" font-weight="700" fill="#c6e88a">≈ 1.5%</text>
    <text x="470" y="358" font-size="10.5" fill="#8fa6c8">(130 位里仅 2 位开销，效率基石)</text>
    <text x="345" y="386" font-weight="700" fill="#8bc6f0">配套机制（撑到 32 GT/s 的关键）</text>
    <text x="345" y="406">· 发送端均衡 EQ：Gen3 引入，Gen4/5 逐代加严</text>
    <text x="345" y="424">· Retimer：长走线上重建信号（Gen4/5 普及）</text>
    <text x="345" y="442">· 更严格的信号完整性与通道损耗预算</text>
    <text x="345" y="468" font-size="10" fill="#8fa6c8">（EQ 四阶段详见 第08章；Retimer 详见本章 📘 块）</text>
  </g>

  <!-- PAM4 展望窄列 -->
  <rect x="720" y="82" width="220" height="410" rx="10" fill="#101c14" stroke="#3a5a2a"/>
  <text x="830" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#c6e88a">🔭 PAM4（Gen6/7 展望）</text>
  <text x="830" y="130" text-anchor="middle" font-size="10" fill="#8fa6c8">64 / 128 GT/s · 4 电平</text>
  <g font-size="10.5" fill="#c6d2e6">
    <text x="736" y="160" font-weight="700" fill="#c6e88a">原理</text>
    <text x="736" y="178">4 电平编码 2 bit/符号</text>
    <text x="736" y="196">同波特率下数据翻倍</text>
    <text x="736" y="222" font-weight="700" fill="#f0a0a0">代价</text>
    <text x="736" y="240">眼图变 3 个且更小</text>
    <text x="736" y="258">→ 误码率飙升</text>
    <text x="736" y="284" font-weight="700" fill="#c6e88a">补救</text>
    <text x="736" y="302">强制 FEC 前向纠错</text>
    <text x="736" y="320">+ Flit 定长封装</text>
    <text x="736" y="346" font-weight="700" fill="#c6e88a">现状</text>
    <text x="736" y="364">Gen6 于 2022 发布，</text>
    <text x="736" y="382">数据中心开始导入；</text>
    <text x="736" y="400">主流部署仍是 Gen4/5</text>
    <text x="736" y="430" font-size="9.5" fill="#6f86a8">详见本章末尾</text>
    <text x="736" y="446" font-size="9.5" fill="#6f86a8">「🔭 Gen6/7 展望」块</text>
    <text x="736" y="462" font-size="9.5" fill="#6f86a8">及 Flit与FEC 对照图</text>
  </g>

  <text x="490" y="524" text-anchor="middle" font-size="12" fill="#8fa6c8">读这张图的主线：8b/10b（历史）→ 128b/130b（现在，20% 开销降到 1.5%）；PAM4 是下一步，非当前主流</text>
  <text x="490" y="550" text-anchor="middle" font-size="11" fill="#6f86a8">提速路径：更密的块（130b）+ 更强的均衡（EQ/Retimer）撑到 32 GT/s；再往上才需要换调制（PAM4）</text>
  <text x="490" y="576" text-anchor="middle" font-size="10.5" fill="#6f86a8">📘 对照 Base Spec 7.0：Physical Layer Logical（Encoding / Scrambling）/ Electrical（EQ）章节</text>
</svg>
