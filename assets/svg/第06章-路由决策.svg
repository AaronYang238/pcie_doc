<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">TLP 的三种路由方式（在 Switch 内如何被转发）</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#5a6b86">Switch = 一堆虚拟 PCI-PCI 桥；每个下行端口有一段地址窗口与一段 Bus 号区间</text>

  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 决策入口 -->
  <rect x="360" y="82" width="240" height="46" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4f9c">收到一个 TLP</text>
  <text x="480" y="121" text-anchor="middle" font-size="11" fill="#3f5678">看 Fmt/Type 判断路由类型</text>

  <!-- 三分支 -->
  <line x1="420" y1="128" x2="180" y2="170" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#a6)"/>
  <line x1="480" y1="128" x2="480" y2="170" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#a6)"/>
  <line x1="540" y1="128" x2="780" y2="170" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#a6)"/>

  <!-- 分支1：地址路由 -->
  <rect x="40" y="174" width="280" height="150" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="180" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1b4f9c">① 基于地址的路由</text>
  <text x="55" y="220" font-size="11.3" fill="#22314f">适用：MRd / MWr / IO 请求</text>
  <text x="55" y="240" font-size="11.3" fill="#22314f">依据：TLP 中的 Address 字段</text>
  <text x="55" y="262" font-size="11.3" fill="#3f5678">逐端口比对 Memory Base/Limit：</text>
  <text x="66" y="282" font-size="11" fill="#3f5678">· 命中某下行窗口 → 下行转发</text>
  <text x="66" y="300" font-size="11" fill="#3f5678">· 都不命中 → 上行转发（默认）</text>
  <text x="55" y="318" font-size="10.5" fill="#8a97ab">即 PCI 时代「正/负向译码」的延续</text>

  <!-- 分支2：ID 路由 -->
  <rect x="340" y="174" width="280" height="150" rx="10" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="480" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">② 基于 ID 的路由</text>
  <text x="355" y="220" font-size="11.3" fill="#22314f">适用：Completion、配置请求</text>
  <text x="355" y="240" font-size="11.3" fill="#22314f">依据：目标 Bus/Dev/Fun（ID）</text>
  <text x="355" y="262" font-size="11.3" fill="#3f5678">按每端口的 Bus 号区间转发：</text>
  <text x="366" y="282" font-size="11" fill="#3f5678">· 目标 Bus 落在下游区间 → 下行</text>
  <text x="366" y="300" font-size="11" fill="#3f5678">· 否则 → 上行</text>
  <text x="355" y="318" font-size="10.5" fill="#8a97ab">CplD 靠 Requester ID 精确回到请求方</text>

  <!-- 分支3：隐式路由 -->
  <rect x="640" y="174" width="280" height="150" rx="10" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="780" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a17">③ 隐式路由</text>
  <text x="655" y="220" font-size="11.3" fill="#22314f">适用：Message（Msg/MsgD）</text>
  <text x="655" y="240" font-size="11.3" fill="#22314f">依据：Type[2:0] 路由子字段</text>
  <text x="655" y="262" font-size="11" fill="#3f5678">· 000 送根复合体 RC</text>
  <text x="655" y="280" font-size="11" fill="#3f5678">· 011 由 RC 广播下行</text>
  <text x="655" y="298" font-size="11" fill="#3f5678">· 100 本地终结（不转发）</text>
  <text x="655" y="318" font-size="10.5" fill="#8a97ab">用于 INTx 模拟 / PME / 错误信令</text>

  <!-- 拓扑示意 -->
  <text x="480" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a4a">在拓扑中的转发方向</text>
  <rect x="410" y="382" width="140" height="40" rx="8" fill="#dfe6f0" stroke="#aab8cc"/>
  <text x="480" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#33415c">RC / 上行</text>
  <rect x="300" y="470" width="150" height="44" rx="8" fill="#eef3f9" stroke="#c7d0dd"/>
  <text x="375" y="497" text-anchor="middle" font-size="12" font-weight="700" fill="#33415c">Switch</text>
  <rect x="150" y="540" width="150" height="40" rx="8" fill="#f2f6fc" stroke="#b7cdf0"/><text x="225" y="565" text-anchor="middle" font-size="11.5" fill="#1b4f9c">Endpoint A</text>
  <rect x="330" y="540" width="150" height="40" rx="8" fill="#f2f6fc" stroke="#b7cdf0"/><text x="405" y="565" text-anchor="middle" font-size="11.5" fill="#1b4f9c">Endpoint B</text>
  <rect x="560" y="470" width="150" height="44" rx="8" fill="#f2f6fc" stroke="#b7cdf0"/><text x="635" y="497" text-anchor="middle" font-size="11.5" fill="#1b4f9c">Endpoint C</text>

  <line x1="480" y1="422" x2="410" y2="470" stroke="#5a6b86" stroke-width="1.6"/>
  <line x1="480" y1="422" x2="635" y2="470" stroke="#5a6b86" stroke-width="1.6"/>
  <line x1="375" y1="514" x2="225" y2="540" stroke="#5a6b86" stroke-width="1.6"/>
  <line x1="375" y1="514" x2="405" y2="540" stroke="#5a6b86" stroke-width="1.6"/>
  <text x="742" y="500" font-size="10.5" fill="#8a97ab">地址/ID 不属下游 → 一律上行到 RC</text>
</svg>
