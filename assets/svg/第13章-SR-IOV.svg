<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">SR-IOV：一块物理卡，硬件里就分身成多块"轻功能"</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">一个 PF（管理）派生多个 VF（各有独立 BAR/配置）；每个 VF 经 IOMMU 直通给一台 VM，绕开宿主软件转发</text>

  <defs>
    <marker id="sr13" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 物理设备 -->
  <rect x="330" y="90" width="300" height="150" rx="12" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="480" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">一块物理 PCIe 设备（如网卡）</text>
  <rect x="350" y="130" width="120" height="90" rx="8" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="410" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#2a3b57">PF</text>
  <text x="410" y="174" text-anchor="middle" font-size="9" fill="#3f5678">Physical Function</text>
  <text x="410" y="190" text-anchor="middle" font-size="9" fill="#3f5678">完整功能 + 管理</text>
  <text x="410" y="206" text-anchor="middle" font-size="9" fill="#8a97ab">宿主驱动持有</text>
  <rect x="486" y="130" width="128" height="90" rx="8" fill="#fff7ec" stroke="#f0c193"/>
  <text x="550" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#a85a17">共享物理资源</text>
  <text x="550" y="172" text-anchor="middle" font-size="9" fill="#3f5678">端口 / 队列引擎 / 分类器</text>
  <text x="550" y="190" text-anchor="middle" font-size="9" fill="#3f5678">由 PF 切分给各 VF</text>
  <text x="550" y="208" text-anchor="middle" font-size="9" fill="#8a97ab">ARI 扩展功能号</text>

  <!-- VFs -->
  <g>
    <rect x="120" y="300" width="180" height="90" rx="10" fill="#efe9f9" stroke="#c4b1e8"/>
    <text x="210" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5cc0">VF0</text>
    <text x="210" y="346" text-anchor="middle" font-size="9" fill="#3f5678">独立 BAR / 配置空间</text>
    <text x="210" y="362" text-anchor="middle" font-size="9" fill="#3f5678">独立队列 + MSI-X</text>
    <text x="210" y="380" text-anchor="middle" font-size="8.5" fill="#8a97ab">轻量：无完整配置头</text>

    <rect x="390" y="300" width="180" height="90" rx="10" fill="#efe9f9" stroke="#c4b1e8"/>
    <text x="480" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5cc0">VF1</text>
    <text x="480" y="346" text-anchor="middle" font-size="9" fill="#3f5678">独立 BAR / 配置空间</text>
    <text x="480" y="362" text-anchor="middle" font-size="9" fill="#3f5678">独立队列 + MSI-X</text>

    <rect x="660" y="300" width="180" height="90" rx="10" fill="#efe9f9" stroke="#c4b1e8"/>
    <text x="750" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5cc0">VF2 … VFn</text>
    <text x="750" y="346" text-anchor="middle" font-size="9" fill="#3f5678">独立 BAR / 配置空间</text>
    <text x="750" y="362" text-anchor="middle" font-size="9" fill="#3f5678">独立队列 + MSI-X</text>
  </g>

  <line x1="410" y1="240" x2="210" y2="300" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <line x1="470" y1="240" x2="480" y2="300" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <line x1="540" y1="240" x2="750" y2="300" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <text x="480" y="272" text-anchor="middle" font-size="10" fill="#7a5cc0">PF 通过 SR-IOV 能力"派生"出 N 个 VF</text>

  <!-- VMs -->
  <g font-size="10" text-anchor="middle">
    <rect x="120" y="440" width="180" height="56" rx="10" fill="#e6f0e9" stroke="#8fd3ac"/>
    <text x="210" y="464" font-size="11.5" font-weight="700" fill="#1c7a4a">VM-A</text>
    <text x="210" y="482" fill="#3f5678">直通 VF0，原生驱动直接用</text>

    <rect x="390" y="440" width="180" height="56" rx="10" fill="#e6f0e9" stroke="#8fd3ac"/>
    <text x="480" y="464" font-size="11.5" font-weight="700" fill="#1c7a4a">VM-B</text>
    <text x="480" y="482" fill="#3f5678">直通 VF1</text>

    <rect x="660" y="440" width="180" height="56" rx="10" fill="#e6f0e9" stroke="#8fd3ac"/>
    <text x="750" y="464" font-size="11.5" font-weight="700" fill="#1c7a4a">VM-C …</text>
    <text x="750" y="482" fill="#3f5678">直通 VF2</text>
  </g>
  <line x1="210" y1="390" x2="210" y2="440" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <line x1="480" y1="390" x2="480" y2="440" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <line x1="750" y1="390" x2="750" y2="440" stroke="#5a6b86" stroke-width="1.6" marker-end="url(#sr13)"/>
  <text x="880" y="418" text-anchor="middle" font-size="9" fill="#c0392b">经 IOMMU 隔离</text>

  <!-- 底注 -->
  <rect x="40" y="514" width="880" height="52" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="536" font-size="11.5" font-weight="700" fill="#1b2a4a">要点：</text>
  <text x="120" y="536" font-size="11" fill="#33415c">VF 是<tspan font-weight="700">硬件级</tspan>虚拟功能——数据面直达 VM、不经宿主软件交换，性能接近裸机；PF 只管配置。</text>
  <text x="60" y="556" font-size="10" fill="#8a97ab">📘 SR-IOV 的粒度是"整个 VF"，资源较重；更细粒度的 Scalable IOV（ADI + IMS）见本章现代化补充。</text>
</svg>
