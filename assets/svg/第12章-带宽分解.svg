<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">有效带宽 = 载荷 ÷（载荷 + 开销）：算清一笔账</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">每个 TLP 都有固定开销（头/序号/LCRC/成帧）+ 周期性 DLLP + 编码；MPS 越大，开销被摊得越薄</text>

  <!-- 一个 TLP 的开销组成 -->
  <text x="60" y="94" font-size="14" font-weight="700" fill="#1b2a4a">① 一个带 256B 载荷的 MWr TLP，在线上占多少</text>
  <g font-size="10" text-anchor="middle">
    <rect x="60" y="106" width="60" height="40" fill="#fdece0" stroke="#f0c193"/><text x="90" y="130" fill="#a85a17">成帧 ~4B</text>
    <rect x="120" y="106" width="50" height="40" fill="#e6f0e9" stroke="#8fd3ac"/><text x="145" y="130" fill="#1c7a4a">Seq 2B</text>
    <rect x="170" y="106" width="90" height="40" fill="#dbe8fb" stroke="#93b7f0"/><text x="215" y="130" fill="#1b4f9c">头 12–16B</text>
    <rect x="260" y="106" width="480" height="40" fill="#bfe3cd" stroke="#4a9a6a"/><text x="500" y="130" fill="#14663f" font-weight="700">数据载荷 256B</text>
    <rect x="740" y="106" width="60" height="40" fill="#e6f0e9" stroke="#8fd3ac"/><text x="770" y="130" fill="#1c7a4a">LCRC 4B</text>
    <rect x="800" y="106" width="60" height="40" fill="#fdece0" stroke="#f0c193"/><text x="830" y="130" fill="#a85a17">成帧 ~4B</text>
  </g>
  <text x="60" y="168" font-size="11" fill="#33415c">固定开销 ≈ 26B，效率 ≈ 256 /（256 + 26）≈ <tspan font-weight="700" fill="#14663f">91%</tspan>（再打折扣：周期性 ACK/UpdateFC DLLP + 编码开销）</text>

  <!-- MPS 曲线 -->
  <text x="60" y="204" font-size="14" font-weight="700" fill="#1c7a4a">② MPS 越大，有效带宽越高（收益递减）</text>
  <g font-size="10.5" text-anchor="middle" fill="#33415c">
    <text x="150" y="228">MPS=128B</text>
    <rect x="60" y="236" width="52" height="22" fill="#c7d0dd"/><rect x="112" y="236" width="180" height="22" fill="#bfe3cd" stroke="#8fd3ac"/><text x="330" y="252" text-anchor="start">≈ 83%</text>
    <text x="150" y="280">MPS=256B</text>
    <rect x="60" y="288" width="28" height="22" fill="#c7d0dd"/><rect x="88" y="288" width="204" height="22" fill="#bfe3cd" stroke="#8fd3ac"/><text x="330" y="304" text-anchor="start">≈ 91%</text>
    <text x="150" y="332">MPS=512B</text>
    <rect x="60" y="340" width="15" height="22" fill="#c7d0dd"/><rect x="75" y="340" width="217" height="22" fill="#bfe3cd" stroke="#8fd3ac"/><text x="330" y="356" text-anchor="start">≈ 95%</text>
  </g>
  <text x="440" y="304" font-size="10" fill="#8a97ab" text-anchor="start">灰=开销，绿=有效载荷</text>

  <!-- 现代速率 -->
  <rect x="500" y="196" width="400" height="180" rx="10" fill="#0f1b2d" stroke="#243a5c"/>
  <text x="520" y="222" font-size="13" font-weight="700" fill="#eaf1fb">📘 用现代速率重算（近似）</text>
  <g font-size="11" fill="#c6d2e6">
    <text x="520" y="248">原书 Gen1 8b/10b：编码就先亏 20%</text>
    <text x="520" y="272">Gen3–5 用 128b/130b：编码仅亏 ~1.5%</text>
    <text x="520" y="300" fill="#8bc6f0">Gen4 x16 裸速 ≈ 31.5 GB/s（单向）</text>
    <text x="520" y="322" fill="#c6e88a">× TLP 效率 ~90% ≈ 28 GB/s 可用</text>
    <text x="520" y="348" fill="#f0b088">Gen5 x16 ≈ 63 GB/s、Gen6 ≈ 121 GB/s（裸速）</text>
    <text x="520" y="368" font-size="9.5" fill="#6f86a8">Flit 模式开销结构不同，需另算</text>
  </g>

  <!-- 延时 + 优化 -->
  <rect x="60" y="392" width="840" height="188" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="80" y="418" font-size="13" font-weight="700" fill="#1b2a4a">③ 带宽 vs 延时：两笔不同的账</text>
  <g font-size="11.3" fill="#33415c">
    <text x="80" y="444">• <tspan font-weight="700">写吞吐</tspan>：主要看 MPS（分片开销）与链路裸速——Posted 写不等回应，容易跑满。</text>
    <text x="80" y="468">• <tspan font-weight="700">读吞吐</tspan> ≈ 在途请求数 × MRRS ÷ RTT——受 Tag 位宽和缓冲/信用限制，不"并发"就跑不满。</text>
    <text x="80" y="492">• <tspan font-weight="700">读延时</tspan> = 链路往返 + Completer 处理，是固定"过路费"，只能靠并发去<tspan font-weight="700">摊薄</tspan>、无法消除。</text>
    <text x="80" y="522" font-weight="700" fill="#1c7a4a">优化清单：</text>
    <text x="80" y="544">增大 MPS/MRRS · 增加在途请求(大 Tag) · 合并描述符减少中断 · 对无依赖数据流开 RO/IDO(第11章)。</text>
    <text x="80" y="568" fill="#8a97ab" font-size="10">🔧 实测跑不满时，依次排查：链路速率/宽度(第04章)、MPS/MRRS(第06章)、在途请求、流控信用(第09章)。</text>
  </g>
</svg>
