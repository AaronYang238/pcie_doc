<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">BAR 探测：软件怎么问出"设备要多大地址窗口"</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">诀窍：写全 1 → 读回来看哪些位被清零 → 最低可变位的权重就是窗口大小 → 再回写分配的基址</text>

  <defs>
    <marker id="b03" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1b4f9c"/></marker>
  </defs>

  <!-- 步骤1 -->
  <rect x="40" y="88" width="880" height="86" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="60" y="112" font-size="13" font-weight="700" fill="#1b4f9c">① 往 BAR 写全 1（0xFFFFFFFF）</text>
  <text x="60" y="134" font-size="10.5" fill="#33415c">软件不知道窗口多大，先"试探"：把 BAR 全写 1。设备硬件会把"大小对应的低位"钉死为 0，只让高位（基址位）可写。</text>
  <g font-size="9" text-anchor="middle" font-family="monospace">
    <rect x="360" y="144" width="240" height="22" fill="#fff" stroke="#93b7f0"/>
    <text x="480" y="159" fill="#1b4f9c">写入: 1111 1111 … 1111</text>
  </g>

  <!-- 步骤2 -->
  <rect x="40" y="186" width="880" height="110" rx="10" fill="#f0faf4" stroke="#8fd3ac"/>
  <text x="60" y="210" font-size="13" font-weight="700" fill="#1c7a4a">② 读回 BAR，看低位被清成了几个 0</text>
  <text x="60" y="232" font-size="10.5" fill="#33415c">假设读回 0xFFF0_0000：低 20 位是 0、从 bit20 起是 1。低 20 位不可变 = 窗口对齐到 2²⁰。</text>
  <g font-size="10" text-anchor="middle" font-family="monospace">
    <rect x="120" y="246" width="500" height="30" fill="#fff" stroke="#8fd3ac"/>
    <text x="250" y="266" fill="#14663f">1111 1111 1111 (高位:基址可变)</text>
    <text x="520" y="266" fill="#c0392b">0000…0000 (低20位钉死)</text>
    <text x="700" y="266" text-anchor="start" fill="#1c7a4a">→ 大小 = 1 MB</text>
  </g>

  <!-- 步骤3 -->
  <rect x="40" y="308" width="880" height="86" rx="10" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="60" y="332" font-size="13" font-weight="700" fill="#a85a17">③ 求窗口大小</text>
  <text x="60" y="354" font-size="10.5" fill="#33415c">把读回值的低位掩码取反 +1（或"最低为 1 的位的权重"）= 窗口字节数。本例 2²⁰ = <tspan font-weight="700" fill="#a85a17">1 MB</tspan>。</text>
  <text x="60" y="376" font-size="10" fill="#8a97ab">同时 BAR 低几位是"类型标志"：bit0=0 表示 Memory BAR（=1 是 I/O）；bit[2:1]=10 表示 64 位；bit3=Prefetchable。</text>

  <!-- 步骤4 -->
  <rect x="40" y="406" width="880" height="86" rx="10" fill="#efe9f9" stroke="#c4b1e8"/>
  <text x="60" y="430" font-size="13" font-weight="700" fill="#7a5cc0">④ 分配一块不冲突的地址，回写 BAR 的基址位</text>
  <text x="60" y="452" font-size="10.5" fill="#33415c">系统在全局地址空间里挑一段对齐的空闲区（并让上游桥的 Memory Base/Limit 窗口覆盖它），把基址写回 BAR。</text>
  <text x="60" y="474" font-size="10" fill="#8a97ab">此后 CPU 访问这段地址 → 经桥/主桥翻译 → 命中该设备的这个 BAR。设备就"上线"了。</text>

  <!-- flow arrows -->
  <line x1="480" y1="174" x2="480" y2="186" stroke="#1b4f9c" stroke-width="1.6" marker-end="url(#b03)"/>
  <line x1="480" y1="296" x2="480" y2="308" stroke="#1b4f9c" stroke-width="1.6" marker-end="url(#b03)"/>
  <line x1="480" y1="394" x2="480" y2="406" stroke="#1b4f9c" stroke-width="1.6" marker-end="url(#b03)"/>

  <!-- 底注 -->
  <rect x="40" y="504" width="880" height="46" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="60" y="526" font-size="11" fill="#33415c">💡 桥的 Base/Limit 窗口也用同样思路初始化，且<tspan font-weight="700">必须覆盖其下游所有设备的 BAR 之并集</tspan>——否则下游设备收不到访问。</text>
  <text x="60" y="543" font-size="10" fill="#8a97ab">📘 现代大 BAR（GPU 显存）用 64 位可预读 BAR + Resizable BAR（可协商窗口大小）。</text>
</svg>
