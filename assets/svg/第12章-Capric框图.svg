<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">Capric 卡框图：一块示例 PCIe 设备的解剖</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">软件通过 BAR 里的寄存器操控设备；设备通过 DMA 引擎搬数据、通过 MSI 通知完成</text>

  <!-- 主机侧 -->
  <rect x="40" y="86" width="250" height="440" rx="12" fill="#dfe6f0" stroke="#8aa0bd"/>
  <text x="165" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#2a3b57">主机（CPU + 内存）</text>
  <rect x="60" y="128" width="210" height="80" rx="8" fill="#ffffff" stroke="#aab8cc"/>
  <text x="165" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#33415c">驱动程序</text>
  <text x="165" y="172" text-anchor="middle" font-size="10" fill="#5a6b86">写寄存器发命令</text>
  <text x="165" y="188" text-anchor="middle" font-size="10" fill="#5a6b86">收 MSI 处理完成</text>
  <rect x="60" y="222" width="210" height="130" rx="8" fill="#f0faf4" stroke="#8fd3ac"/>
  <text x="165" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c7a4a">主存缓冲区</text>
  <rect x="76" y="258" width="178" height="30" rx="5" fill="#fff" stroke="#a9dcc0"/><text x="165" y="278" text-anchor="middle" font-size="9.5" fill="#33415c">描述符（地址+长度）</text>
  <rect x="76" y="294" width="178" height="46" rx="5" fill="#fff" stroke="#a9dcc0"/><text x="165" y="314" text-anchor="middle" font-size="9.5" fill="#33415c">数据缓冲</text><text x="165" y="330" text-anchor="middle" font-size="9" fill="#8a97ab">DMA 读/写的目标</text>
  <rect x="60" y="366" width="210" height="50" rx="8" fill="#fdf1e7" stroke="#f0c193"/>
  <text x="165" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#a85a17">中断系统（Local APIC）</text>
  <text x="165" y="406" text-anchor="middle" font-size="9.5" fill="#3f5678">接收 MSI → 触发 handler</text>

  <!-- 链路 -->
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#8a97ab" transform="rotate(-90 480 300)">PCIe 链路（TLP）</text>
  <line x1="290" y1="290" x2="670" y2="290" stroke="#c7d0dd" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 设备侧 -->
  <rect x="670" y="86" width="250" height="440" rx="12" fill="#e9f7ef" stroke="#8fd3ac"/>
  <text x="795" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">Capric 卡（Endpoint）</text>

  <rect x="690" y="128" width="210" height="110" rx="8" fill="#ffffff" stroke="#a9dcc0"/>
  <text x="795" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c7a4a">BAR0：寄存器（MMIO）</text>
  <g font-size="9.5" fill="#33415c" text-anchor="middle">
    <text x="795" y="170">Control / Status</text>
    <text x="795" y="186">DMA 源/目的地址、长度</text>
    <text x="795" y="202">Doorbell（"开工"触发位）</text>
    <text x="795" y="222">MSI 配置</text>
  </g>

  <rect x="690" y="252" width="210" height="60" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="795" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b4f9c">BAR2：数据缓冲（可选）</text>
  <text x="795" y="296" text-anchor="middle" font-size="9.5" fill="#3f5678">设备本地 buffer / 寄存器阵列</text>

  <rect x="690" y="326" width="210" height="80" rx="8" fill="#fff7ec" stroke="#f0c193"/>
  <text x="795" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a85a17">DMA 引擎</text>
  <text x="795" y="370" text-anchor="middle" font-size="9.5" fill="#3f5678">作为 Requester 主动读/写主存</text>
  <text x="795" y="386" text-anchor="middle" font-size="9.5" fill="#3f5678">发 MWr（写）/ MRd（读）TLP</text>

  <rect x="690" y="420" width="210" height="50" rx="8" fill="#efe9f9" stroke="#c4b1e8"/>
  <text x="795" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5cc0">中断单元（MSI）</text>
  <text x="795" y="460" text-anchor="middle" font-size="9.5" fill="#3f5678">完成后发 MSI（一次 MWr）</text>

  <!-- 交互标注 -->
  <text x="480" y="150" text-anchor="middle" font-size="10" fill="#1b4f9c">① CPU 写 BAR0 寄存器（MMIO 下行）</text>
  <text x="480" y="360" text-anchor="middle" font-size="10" fill="#a85a17">② 设备 DMA 读写主存（上行）</text>
  <text x="480" y="445" text-anchor="middle" font-size="10" fill="#7a5cc0">③ 设备发 MSI 通知（上行 Posted 写）</text>

  <text x="480" y="510" text-anchor="middle" font-size="11" fill="#33415c">💡 这就是几乎所有 PCIe 设备（网卡/NVMe/GPU）的通用范式：寄存器控制 + 描述符 + DMA + 中断</text>
  <text x="480" y="532" text-anchor="middle" font-size="10.5" fill="#8a97ab">下面两张图分别拆解"DMA 写"和"DMA 读"到底发了哪些 TLP</text>
</svg>
