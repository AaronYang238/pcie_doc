<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">ATS：让设备自己缓存翻译，绕开 IOMMU 的瓶颈</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#5a6b86">设备先向 IOMMU 请求翻译、把结果存进本地 ATC；之后用"已翻译地址"直发，页表变更时靠 Invalidate 握手同步</text>

  <defs>
    <marker id="at13" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a85a17"/></marker>
    <marker id="at13c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1c7a4a"/></marker>
    <marker id="at13r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>

  <text x="240" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1c7a4a">设备（带 ATC）</text>
  <text x="720" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a17">RC + IOMMU</text>
  <line x1="240" y1="100" x2="240" y2="500" stroke="#8fd3ac" stroke-width="2"/>
  <line x1="720" y1="100" x2="720" y2="500" stroke="#f0c193" stroke-width="2"/>

  <!-- 翻译请求 -->
  <line x1="240" y1="130" x2="720" y2="146" stroke="#a85a17" stroke-width="2" marker-end="url(#at13)"/>
  <text x="480" y="126" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a85a17">① 翻译请求（AT = Translation Request）</text>
  <line x1="720" y1="176" x2="240" y2="192" stroke="#1c7a4a" stroke-width="2" marker-end="url(#at13c)"/>
  <text x="480" y="172" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c7a4a">② 翻译完成：返回物理地址 + 权限</text>

  <!-- 缓存 -->
  <rect x="80" y="206" width="320" height="34" rx="8" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="240" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1b4f9c">③ 存入本地 ATC（Address Translation Cache）</text>

  <!-- 使用已翻译地址 -->
  <line x1="240" y1="270" x2="720" y2="286" stroke="#1c7a4a" stroke-width="2.4" marker-end="url(#at13c)"/>
  <text x="480" y="266" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c7a4a">④ 用"已翻译地址"直接 DMA（AT = Translated）</text>
  <text x="480" y="306" text-anchor="middle" font-size="10" fill="#8a97ab">IOMMU 认出 AT=已翻译 → 免查页表，直接放行 → 省掉翻译延时、卸掉 IOMMU 压力</text>

  <!-- Invalidate 握手 -->
  <rect x="300" y="330" width="360" height="26" rx="6" fill="#faf0f0" stroke="#e0b0b0"/>
  <text x="480" y="348" text-anchor="middle" font-size="10" fill="#c0392b">此后：OS 改了页表映射 → 设备 ATC 里的旧翻译必须作废</text>

  <line x1="720" y1="378" x2="240" y2="394" stroke="#c0392b" stroke-width="2" marker-end="url(#at13r)"/>
  <text x="480" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">⑤ Invalidation Request（使某地址的 ATC 失效）</text>
  <line x1="240" y1="424" x2="720" y2="440" stroke="#a85a17" stroke-width="2" marker-end="url(#at13)"/>
  <text x="480" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#a85a17">⑥ Invalidation Completion（设备确认已清）</text>
  <text x="480" y="462" text-anchor="middle" font-size="10" fill="#8a97ab">必须等设备确认，OS 才能安全复用该物理页——否则设备可能用陈旧翻译打错地方</text>

  <!-- 小结 -->
  <rect x="60" y="486" width="840" height="96" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="80" y="510" font-size="12.5" font-weight="700" fill="#1b2a4a">为什么要 ATS</text>
  <g font-size="11" fill="#33415c">
    <text x="80" y="532">• <tspan font-weight="700">没有 ATS</tspan>：每个 DMA 都要 IOMMU 现场翻译，高并发下 IOMMU/IOTLB 成瓶颈、增加延时。</text>
    <text x="80" y="554">• <tspan font-weight="700" fill="#1c7a4a">有 ATS</tspan>：设备缓存翻译、用已翻译地址直发，把翻译工作分摊到设备侧——代价是多一套 Invalidate 一致性协议。</text>
    <text x="80" y="574" fill="#8a97ab" font-size="10">📘 TLP 头的 AT（Address Type）字段标识"未翻译 / 翻译请求 / 已翻译"三种地址；配合 PRI 可支持可分页 DMA。</text>
  </g>
</svg>
