<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#f7f9fc" stroke="#d8dee9"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2a4a">一个存储器读，为什么会收到多个完成报文？</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#5a6b86">读请求（MRd）的返回数据被 Completer 按 RCB（读完成边界）对齐拆分成多个 CplD</text>

  <defs>
    <marker id="r6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6b86"/></marker>
  </defs>

  <!-- 请求方 / 完成方 -->
  <rect x="60" y="92" width="180" height="60" rx="10" fill="#eaf2fe" stroke="#93b7f0"/>
  <text x="150" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4f9c">Requester</text>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#3f5678">发起 DMA 读的设备</text>
  <rect x="720" y="92" width="180" height="60" rx="10" fill="#efe9f9" stroke="#c4b1e8"/>
  <text x="810" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5cc0">Completer</text>
  <text x="810" y="138" text-anchor="middle" font-size="11" fill="#3f5678">RC / 目标（含内存）</text>

  <!-- 请求 -->
  <rect x="300" y="100" width="360" height="44" rx="8" fill="#fff2e0" stroke="#f0c193"/>
  <text x="480" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b26a00">MRd：读 256 字节 @ 地址 0x...40</text>
  <text x="480" y="138" text-anchor="middle" font-size="10.5" fill="#8a6a3a">Non-Posted，Length=64 DW，带 Tag</text>
  <line x1="240" y1="122" x2="300" y2="122" stroke="#5a6b86" stroke-width="1.8" marker-end="url(#r6)"/>
  <line x1="660" y1="122" x2="720" y2="122" stroke="#5a6b86" stroke-width="1.8" marker-end="url(#r6)"/>

  <!-- 返回：多个 CplD -->
  <text x="480" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a4a">Completer 按 RCB=64B 对齐拆分返回（本例 256B → 4 个 CplD）</text>

  <g font-size="11" text-anchor="middle">
    <!-- CplD1 -->
    <rect x="150" y="204" width="620" height="40" rx="7" fill="#efe9f9" stroke="#c4b1e8"/>
    <text x="230" y="228" fill="#7a5cc0" font-weight="700">CplD #1</text>
    <text x="470" y="223" fill="#33415c">字节 0x40–0x7F（64B）</text>
    <text x="470" y="238" fill="#8a97ab" font-size="9.5">Byte Count=256（剩余总量）· Lower Address=0x40</text>
    <!-- CplD2 -->
    <rect x="150" y="252" width="620" height="40" rx="7" fill="#f3eefb" stroke="#c4b1e8"/>
    <text x="230" y="276" fill="#7a5cc0" font-weight="700">CplD #2</text>
    <text x="470" y="271" fill="#33415c">字节 0x80–0xBF（64B）</text>
    <text x="470" y="286" fill="#8a97ab" font-size="9.5">Byte Count=192 · Lower Address=0x80</text>
    <!-- CplD3 -->
    <rect x="150" y="300" width="620" height="40" rx="7" fill="#efe9f9" stroke="#c4b1e8"/>
    <text x="230" y="324" fill="#7a5cc0" font-weight="700">CplD #3</text>
    <text x="470" y="319" fill="#33415c">字节 0xC0–0xFF（64B）</text>
    <text x="470" y="334" fill="#8a97ab" font-size="9.5">Byte Count=128 · Lower Address=0xC0</text>
    <!-- CplD4 -->
    <rect x="150" y="348" width="620" height="40" rx="7" fill="#f3eefb" stroke="#c4b1e8"/>
    <text x="230" y="372" fill="#7a5cc0" font-weight="700">CplD #4</text>
    <text x="470" y="367" fill="#33415c">字节 0x100–0x13F（64B）</text>
    <text x="470" y="382" fill="#8a97ab" font-size="9.5">Byte Count=64（最后一块）· Lower Address=0x100</text>
  </g>
  <line x1="810" y1="152" x2="810" y2="360" stroke="#c4b1e8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="770" y1="224" x2="240" y2="224" stroke="#7a5cc0" stroke-width="1.2" marker-end="url(#r6)" opacity="0.5"/>

  <!-- 要点 -->
  <rect x="60" y="410" width="840" height="130" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="80" y="436" font-size="13" font-weight="700" fill="#1b2a4a">为什么这样设计 · 三个要点</text>
  <g font-size="11.5" fill="#33415c">
    <text x="80" y="460">• <tspan font-weight="700">RCB（64B 或 128B）</tspan>：Completer 只能在 RCB 边界处断开，保证每个 CplD 地址对齐、便于重组。</text>
    <text x="80" y="483">• <tspan font-weight="700">同一 Tag</tspan>：所有 CplD 共用请求的 Tag；Requester 靠 Tag + Lower Address 把碎片拼回。</text>
    <text x="80" y="506">• <tspan font-weight="700">Byte Count</tspan> 递减到本块为止，Requester 据此判断「是否收齐」。写请求无此问题（Posted 无返回）。</text>
    <text x="80" y="529" fill="#5a6b86" font-size="10.5">📘 影响吞吐：在途请求数受 Tag 位宽限制；Gen 提速后需 10/14-bit Tag 才能填满管道（见 第12章 带宽分析）。</text>
  </g>
</svg>
